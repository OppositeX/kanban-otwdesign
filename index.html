<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Project tasks — kanban</title>
<style>
/* ── Design tokens ──
   Easing curves + duration/scale conventions per Emil Kowalski's design-eng
   principles (github.com/emilkowalski/skills): custom cubic-beziers (never
   ease-in for UI), sub-300ms interactions, scale(0.97) press feedback,
   percentage-based translateY for sheets, hover gated behind (hover:hover). */
:root {
  color-scheme: dark;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
  --edge: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; min-width: 0; }
html, body { overflow-x: hidden; width: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #0b0b0d;
  color: #e8e8e6;
  -webkit-font-smoothing: antialiased;
  padding: var(--sp-3);
  line-height: 1.4;
}
.app { max-width: 1400px; margin: 0 auto; width: 100%; }
img, svg { max-width: 100%; }

/* Anything that must scroll horizontally does so in its own contained strip —
   the page body itself must never gain a horizontal scrollbar. Both .filters
   and .col-toggles are scroll strips directly (no wrapper element needed). */
.filters, .col-toggles {
  display: flex; flex-wrap: nowrap; gap: 6px;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; -ms-overflow-style: none;
}
.filters::-webkit-scrollbar, .col-toggles::-webkit-scrollbar { display: none; }
.filters > *, .col-toggles > * { flex: 0 0 auto; scroll-snap-align: start; }
.filters {
  padding: 2px 2px 6px; margin: 0 -2px var(--sp-1);
  mask-image: linear-gradient(to right, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
}

.head {
  display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}
.title { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.2px; }
.meta { font-size: 12px; color: #8a8a85; margin-top: 3px; }
.head-actions { display: flex; gap: var(--sp-2); align-items: center; }
.icon-btn {
  width: 36px; height: 36px; flex: none; border-radius: var(--radius-sm); border: 0.5px solid rgba(255,255,255,0.1);
  background: transparent; color: #8a8a85; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out), color 160ms var(--ease-out);
}
.icon-btn svg { width: 15px; height: 15px; }
.summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-2); margin-bottom: var(--sp-3); }
.stat { background: #16161a; border: 0.5px solid rgba(255,255,255,0.08); border-radius: var(--radius-md); padding: var(--sp-2) var(--sp-3); min-width: 0; }
.stat-label { font-size: 10px; color: #8a8a85; display: block; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value { font-size: 19px; font-weight: 600; }
.banner { background: #16161a; border: 0.5px solid rgba(255,255,255,0.08); border-radius: var(--radius-md); padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-4); font-size: 11px; color: #9c9c97; display: flex; align-items: flex-start; gap: var(--sp-2); line-height: 1.5; overflow-wrap: anywhere; }
.banner-dot { width: 6px; height: 6px; border-radius: 50%; background: #5DCAA5; flex: none; margin-top: 5px; }
.filters { margin-bottom: var(--sp-3); }
.chip {
  font-size: 12px; padding: 7px 12px; border-radius: 999px; border: 0.5px solid rgba(255,255,255,0.12);
  background: #16161a; cursor: pointer; color: #b5b5b0; display: inline-flex; align-items: center; gap: 7px;
  font-family: inherit; white-space: nowrap;
  transition: border-color 160ms var(--ease-out), color 160ms var(--ease-out), background 160ms var(--ease-out), transform 120ms var(--ease-out);
}
.chip.active { background: #f0f0ee; color: #0b0b0d; border-color: #f0f0ee; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.grid { display: grid; grid-template-columns: 1fr; gap: var(--sp-2); align-items: start; }
.col { background: #131316; border-radius: var(--radius-lg); padding: var(--sp-2); min-height: 0; border: 0.5px solid rgba(255,255,255,0.04); min-width: 0; }
.col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-2); padding: 0 var(--sp-1); }
.col-name { font-size: 12px; font-weight: 600; }
.col-count { font-size: 10px; color: #8a8a85; background: #1f1f24; padding: 2px 8px; border-radius: 999px; border: 0.5px solid rgba(255,255,255,0.06); }
.card {
  background: #1c1c20; border-radius: var(--radius-sm); border: 0.5px solid rgba(255,255,255,0.06);
  padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); cursor: grab; min-width: 0;
  transition: border-color 160ms var(--ease-out), opacity 160ms var(--ease-out), transform 120ms var(--ease-out);
}
.card:active { cursor: grabbing; }
.card.dragging { opacity: 0.4; transform: scale(0.98); }
.col.drop-target { background: #1a2030; outline: 1.5px dashed rgba(133,183,235,0.5); outline-offset: -4px; }
.col-toggles { margin-bottom: var(--sp-3); padding: var(--sp-2) var(--sp-3); background: #16161a; border-radius: var(--radius-md); border: 0.5px solid rgba(255,255,255,0.06); }
.col-toggles .chip { opacity: 0.45; }
.col-toggles .chip.active { opacity: 1; background: #1f1f24; color: #efefed; border-color: rgba(255,255,255,0.18); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.card-tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.2px; white-space: nowrap; }
.card-id { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; color: #6f6f6a; background: #0f0f12; padding: 2px 6px; border-radius: 4px; border: 0.5px solid rgba(255,255,255,0.06); cursor: pointer; user-select: all; white-space: nowrap; transition: color 160ms var(--ease-out), border-color 160ms var(--ease-out); }
.card-id.copied { color: #5DCAA5; border-color: rgba(93,202,165,0.4); }
.card-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; margin: 0; color: #efefed; overflow-wrap: anywhere; }
.card-note-dot { display: inline-flex; vertical-align: middle; color: #EF9F27; margin-left: 5px; cursor: help; }
.card-note-dot svg { width: 11px; height: 11px; display: block; }
.card-note { font-size: 11.5px; color: #EF9F27; margin: 0; padding-left: 8px; border-left: 2px solid rgba(239,159,39,0.4); line-height: 1.45; overflow-wrap: anywhere; }
.tlinks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tlink { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 3px 9px; border-radius: 999px; background: #131316; border: 0.5px solid rgba(255,255,255,0.1); color: #9c9c97; text-decoration: none; max-width: 100%; transition: color 160ms var(--ease-out), border-color 160ms var(--ease-out), transform 120ms var(--ease-out); }
.tlink span { overflow-wrap: anywhere; }
.tlink svg { width: 10px; height: 10px; flex: none; }
.card-by { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; color: #6f6f6a; margin-left: 8px; background: #0f0f12; border: 0.5px solid rgba(255,255,255,0.06); padding: 1px 6px; border-radius: 999px; overflow-wrap: anywhere; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: var(--sp-2); font-size: 11px; color: #6f6f6a; flex-wrap: wrap; gap: 6px; }
.pri { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pri-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.actions { display: flex; gap: 4px; flex-wrap: wrap; }
.act {
  font-size: 12px; padding: 5px 9px; min-height: 30px; border-radius: var(--radius-sm); border: 0.5px solid rgba(255,255,255,0.1);
  background: transparent; color: #b5b5b0; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 5px;
  transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 120ms var(--ease-out);
}
.archive-toggle {
  font-size: 11px; padding: 6px 12px; min-height: 30px; border-radius: var(--radius-sm); border: 0.5px solid rgba(255,255,255,0.1);
  background: transparent; color: #8a8a85; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out), color 160ms var(--ease-out);
}
.archive-toggle.on { color: #b5b5b0; border-color: rgba(255,255,255,0.18); }
.archive-toggle .badge { font-size: 10px; opacity: 0.6; }
.scope { margin-top: var(--sp-2); padding-top: var(--sp-2); border-top: 0.5px solid rgba(255,255,255,0.07); }
.scope-label { font-size: 10px; color: #6f6f6a; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.check { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; cursor: pointer; font-size: 12.5px; color: #c5c5c0; line-height: 1.45; min-height: 30px; }
.check input { margin: 2px 0 0; flex: none; accent-color: #5DCAA5; cursor: pointer; width: 16px; height: 16px; }
.check.checked .check-text { text-decoration: line-through; color: #6f6f6a; }
.check-text { flex: 1; overflow-wrap: anywhere; }
.scope-empty { font-size: 11px; color: #5a5a55; font-style: italic; }

/* ── Task detail sheet — same sheet/dialog system as Projects, just a
   different body. Cards on the board show title only; this is "everything
   organized" behind a tap. ── */
.task-detail-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.task-detail-title { font-size: 17px; font-weight: 700; line-height: 1.35; margin: 0 0 var(--sp-3); color: #efefed; overflow-wrap: anywhere; }
.task-detail-meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4); font-size: 11px; color: #6f6f6a; }
.task-section { margin-bottom: var(--sp-4); }
.task-detail-summary { font-size: 13.5px; color: #d5d5d0; line-height: 1.55; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.task-detail-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding-top: var(--sp-3); border-top: 0.5px solid rgba(255,255,255,0.07); }
.task-detail-actions .act { font-size: 12.5px; padding: 8px 14px; }
.act svg { width: 12px; height: 12px; flex: none; }
.scope-progress { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: #8a8a85; margin-left: 6px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.empty { font-size: 12px; color: #5a5a55; text-align: center; padding: 1.5rem 0; font-style: italic; }
.timer { display: inline-flex; align-items: center; gap: 4px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 0.5px solid rgba(255,255,255,0.06); white-space: nowrap; }
.timer.live { background: rgba(133,183,235,0.08); border-color: rgba(133,183,235,0.25); color: #85B7EB; }
.timer.live .pulse { width: 5px; height: 5px; border-radius: 50%; background: #85B7EB; flex: none; animation: pulse 1.6s ease-in-out infinite; }
.timer.shipped { background: rgba(93,202,165,0.08); border-color: rgba(93,202,165,0.25); color: #5DCAA5; }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .timer.live .pulse { animation: none; }
}

/* ── Projects entry point ── */
.qlinks-wrap { margin-bottom: var(--sp-4); }
.projects-btn {
  width: 100%; background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-md); padding: 11px 16px; font-size: 13.5px; font-weight: 600; letter-spacing: 0.2px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(79,70,229,0.25); font-family: inherit;
  transition: box-shadow 200ms var(--ease-out), transform 120ms var(--ease-out);
}

/* ── Projects sheet: bottom sheet on mobile, centered dialog from 700px up ── */
.projects-modal {
  position: fixed; inset: 0; z-index: 1000;
  display: none; align-items: flex-end; justify-content: center;
  background: rgba(7,7,9,0); backdrop-filter: blur(0px);
  transition: background 280ms var(--ease-out), backdrop-filter 280ms var(--ease-out);
}
.projects-modal.is-open { background: rgba(7,7,9,0.72); backdrop-filter: blur(4px); }
.projects-modal-panel {
  background: #131317; border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%; max-width: 900px; max-height: 86dvh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 -12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(99,102,241,0.14);
  transform: translateY(100%); opacity: 0.4;
  transition: transform 320ms var(--ease-drawer), opacity 200ms var(--ease-out);
  padding-bottom: var(--edge);
}
.projects-modal.is-open .projects-modal-panel { transform: translateY(0); opacity: 1; }
.sheet-handle-wrap { display: flex; justify-content: center; padding: 10px 0 2px; touch-action: none; cursor: grab; flex: none; }
.sheet-handle-wrap:active { cursor: grabbing; }
.sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.18); }
.projects-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 4px var(--sp-4) var(--sp-3); flex: none; }
.projects-modal-title { font-size: 13px; color: #c7c7cc; text-transform: uppercase; letter-spacing: 0.4px; }
.projects-modal-close {
  background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #d4d4d8; width: 30px; height: 30px;
  border-radius: var(--radius-sm); font-size: 18px; line-height: 1; cursor: pointer;
  transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out);
}
.qlinks {
  display: flex; flex-direction: column; gap: var(--sp-2);
  padding: 0 var(--sp-4) var(--sp-4); overflow-y: auto; overscroll-behavior: contain;
  /* Fill the remaining flex-column space inside the (fixed-height) panel and
     let THIS scroll internally — without flex:1 + min-height:0 here, some
     browsers let the panel itself grow/shrink to fit content instead,
     which reads as the whole sheet "jumping" every time content changes. */
  flex: 1 1 0%; min-height: 0;
}
.qcard {
  background: #16161a; border: 0.5px solid rgba(255,255,255,0.08); border-radius: var(--radius-md);
  padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); text-align: left; cursor: pointer;
  transition: border-color 160ms var(--ease-out), transform 120ms var(--ease-out);
}
.qcard.active { outline: 2px solid #6366f1; outline-offset: 1px; }
.qcard-top { display: flex; align-items: center; gap: var(--sp-3); }
.qinfo { flex: 1; min-width: 0; }
.qlogo { width: 38px; height: 38px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; letter-spacing: -0.5px; color: #fff; overflow: hidden; flex: none; }
.qlogo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; box-sizing: border-box; }
.qlogo.bare { background: transparent !important; padding: 0; }
.qlogo.bare img { padding: 0; }
.qname { font-size: 13px; font-weight: 600; color: #efefed; line-height: 1.3; overflow-wrap: anywhere; }
.qlinks-row { display: flex; gap: 6px; flex-wrap: wrap; }
.handoff-badge { font-size: 10px; color: #6f6f6a; display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,0.04); overflow-wrap: anywhere; }
.handoff-badge.has { color: #5DCAA5; background: rgba(93,202,165,0.08); }
.resume-btn {
  width: 100%; font-size: 12px; font-weight: 500; padding: 8px 10px; min-height: 34px; border-radius: var(--radius-sm);
  border: 0.5px solid rgba(99,102,241,0.4); background: rgba(99,102,241,0.14); color: #c7c7fa; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out), transform 120ms var(--ease-out);
}
.resume-btn svg { width: 12px; height: 12px; flex: none; }
.qlink {
  display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: var(--radius-sm);
  background: #1f1f24; border: 0.5px solid rgba(255,255,255,0.08); color: #b5b5b0; text-decoration: none;
  transition: background 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out), transform 120ms var(--ease-out);
}
.qlink svg { width: 14px; height: 14px; }

/* ── Project folders — personal organization only, local to this browser ── */
.new-folder-btn {
  width: 100%; font-size: 12.5px; font-weight: 500; padding: 9px 10px; min-height: 36px; margin-bottom: var(--sp-1);
  border-radius: var(--radius-sm); border: 1px dashed rgba(255,255,255,0.18); background: transparent; color: #9c9c97;
  cursor: pointer; font-family: inherit; transition: border-color 160ms var(--ease-out), color 160ms var(--ease-out), background 160ms var(--ease-out);
}
.qfolder { margin-bottom: var(--sp-1); }
.qfolder-head {
  display: flex; align-items: center; gap: var(--sp-2); padding: 9px var(--sp-2); cursor: pointer; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.03); transition: background 160ms var(--ease-out);
}
.qfolder-chevron { font-size: 10px; color: #8a8a85; transition: transform 200ms var(--ease-out); flex: none; }
.qfolder-chevron.collapsed { transform: rotate(-90deg); }
.qfolder-name { font-size: 12.5px; font-weight: 600; color: #d5d5d0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
/* A persistent, always-visible strip of member logos — a folder collapses
   its card list, never its identity, so you can tell what's inside without
   opening it. */
.qfolder-avatars { display: flex; align-items: center; flex: none; }
.mini-logo {
  width: 20px; height: 20px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 8.5px; font-weight: 700; color: #fff; border: 2px solid #131317; margin-left: -7px; overflow: hidden; flex: none;
}
.mini-logo:first-child { margin-left: 0; }
.mini-logo img { width: 100%; height: 100%; object-fit: contain; padding: 2px; box-sizing: border-box; background: #1f1f24; }
.mini-logo.bare img { padding: 0; background: transparent; }
.mini-logo-more { background: #2a2a30; color: #b5b5b0; font-size: 7.5px; }
.qfolder-count { font-size: 10px; color: #8a8a85; background: #1f1f24; padding: 1px 7px; border-radius: 999px; flex: none; }
.qfolder-actions { display: flex; gap: 2px; flex: none; }
.qfolder-actions button {
  width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent; color: #6f6f6a; cursor: pointer;
  font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  transition: background 160ms var(--ease-out), color 160ms var(--ease-out);
}
.qfolder-actions button svg { width: 12px; height: 12px; }
/* .qcard-list is the shared "row of cards" layout — mobile: stacked flex
   column (set once, generically, below); desktop: switches to a grid via
   the >=700px block above. Both folder bodies and the unfiled section use
   it, so cards always look consistent regardless of whether they're grouped. */
.qcard-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.qfolder-body { padding: var(--sp-2) 0 0 var(--sp-2); border-left: 2px solid rgba(255,255,255,0.06); margin: 2px 0 0 12px; }
.qfolder-empty { font-size: 11px; color: #5a5a55; font-style: italic; padding: 4px 2px 8px; }
.qfolder-label { font-size: 10px; color: #6f6f6a; text-transform: uppercase; letter-spacing: 0.4px; margin: var(--sp-2) 2px 2px; }
.folder-select {
  width: 100%; margin-top: 6px; font-size: 11px; padding: 6px 8px; border-radius: var(--radius-sm);
  border: 0.5px solid rgba(255,255,255,0.1); background: #131316; color: #9c9c97; font-family: inherit; cursor: pointer;
}
.folder-delete-confirm {
  height: 26px; padding: 0 10px; border-radius: 6px; border: 0.5px solid rgba(226,75,74,0.5);
  background: rgba(226,75,74,0.15); color: #E24B4A; cursor: pointer; font-family: inherit; font-size: 10.5px; font-weight: 600;
  white-space: nowrap;
}
.trash-toggle {
  width: 100%; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #6f6f6a; padding: 8px 10px;
  margin-top: var(--sp-2); border-radius: var(--radius-sm); border: none; background: transparent; cursor: pointer; font-family: inherit;
}

  z-index: 2000; overflow-wrap: anywhere;
}
.toast.show { opacity: 1; transform: translateY(0); }

.act-menu-btn {

.act-menu-btn svg { width: 13px; height: 13px; }
.action-menu {
  position: fixed; z-index: 1500; display: none; flex-direction: column; gap: 1px;

   scoped to .sheet-full (the Projects modal) only — the task detail sheet

// Builds the full copy-paste "resume this project" prompt: fixed protocol
// instructions (this is the part "kanban" itself contributes) wrapped around
// whatever handoff manual the last agent session left behind. One click on
// the board replaces manually re-typing/assembling this by hand.
function generateResumePrompt(key) {
  const p = projects[key];
  if (!p) return '';
  const prefix = p.prefix || '<ASK-OMRI-FOR-PREFIX>';
  const slug = 'agent-' + key;
  const linksBlock = (p.links || []).map(l => '  - ' + (l.label || l.kind) + ': ' + l.url).join('\n') || '  (none registered — add some once you find them)';
  const handoffBlock = (p.handoff && p.handoff.trim())
    ? p.handoff.trim()
    : '(No handoff manual written yet for this project. Once you have useful context to leave — architecture, decisions made and why, gotchas, current state — write one using the command under "UPDATE THE HANDOFF" below, before you stop or hand off.)';
  return [
    'You are resuming work on ' + p.name + ' after a session restart/interruption. Read the',
    'handoff manual below first — it is what the previous session left for you — then follow',
    'the sync protocol to catch up on open tasks before doing anything else.',
    '',
    'PROJECT: ' + p.name,
    'Kanban proj key: ' + key + '   Task ID prefix: ' + prefix + '   Agent slug: ' + slug,
    'Board: https://kanban-otwdesign.vercel.app',
    'Full sync protocol: https://github.com/OppositeX/kanban-otwdesign/blob/main/AGENTS.md',
    '',
    'KNOWN LINKS:',
    linksBlock,
    '',
    '═══ HANDOFF MANUAL (written by the previous session) ═══',
    handoffBlock,
    '═══ END HANDOFF MANUAL ═══',
    '',
    'WHAT TO DO NOW:',
    '',
    'KANBAN_URL="https://yxaxmqmkfyhsawbdlloo.supabase.co/rest/v1"',
    'KANBAN_KEY="' + SUPABASE_ANON_KEY + '"',
    'AUTH=(-H "apikey: $KANBAN_KEY" -H "Authorization: Bearer $KANBAN_KEY")',
    '',
    '1. Pull your open cards and reconcile them against the handoff above + actual repo/deploy state:',
    '   curl -s "${AUTH[@]}" "$KANBAN_URL/kanban_tasks?proj=eq.' + key + '&col=not.in.(done,archive)&select=*&order=col.asc,updated_at.desc"',
    '',
    '2. Resume whatever the handoff says was in progress (or pick up the next thing). Claim it:',
    '   curl -s -X PATCH "${AUTH[@]}" -H "Content-Type: application/json" \\',
    '     "$KANBAN_URL/kanban_tasks?id=eq.' + prefix + '-NNN" \\',
    '     -d \'{"col":"wip","note":"<what you are doing now>","updated_by":"' + slug + '"}\'',
    '',
    '3. Follow the ongoing discipline from AGENTS.md: update the card after every real step,',
    '   only mark a card "done" once actually verified, use "wait" + a specific note when',
    '   blocked on Omri, only touch rows where proj="' + key + '".',
    '',
    '4. UPDATE THE HANDOFF before you stop or hand off again — this is what makes the next',
    '   restart painless. Keep it short: current state, key decisions + why, gotchas/traps,',
    '   where credentials/config live (never the secrets themselves), exactly what to do next.',
    '   This is a full-text replace, not an append:',
    '   curl -s -X PATCH "${AUTH[@]}" -H "Content-Type: application/json" \\',
    '     "$KANBAN_URL/kanban_projects?key=eq.' + key + '" \\',
    '     -d \'{"handoff":"<updated manual as one string>","handoff_updated_by":"' + slug + '"}\''
  ].join('\n');
}

async function sbPatchTask(id, patch) {
  if (!sbConfigured) return false;
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + TASKS_TABLE + '?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify(patch)
    });
    if (!r.ok) console.warn('[kanban] sbPatchTask', id, 'HTTP', r.status);
    return r.ok;
  } catch (e) { console.warn('[kanban] sbPatchTask failed', e); return false; }
}

  { id: 'CNV-139', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T22:30:00Z', shippedAt: '2026-05-10T23:00:00Z', t: 'Studio/GSAP mode toggle in admin bar (3.0.78)', s: 'User report: GSAP scroll-tween cannot run while editing in Studio — admin mode hard-coded disableGsap=true. Implemented mode toggle: localStorage.cnvsMode = studio|gsap. WP admin bar gets a pill (CNVS: Studio / CNVS: GSAP), click toggles + reloads. Two-condition gate (Path B as user preferred): GSAP fires only when mode===gsap AND localStorage[cnvs.editor.uiHidden]===1 (Alt+\ hides studio). Visitor behaviour unchanged (animation_settings.global.enabled). PHP touches: canvas-studio-for-elementor.php (admin_bar_menu + footer JS), widget.php enqueue_theatre_scripts disableGsap rewritten as runtime IIFE that reads localStorage, shortcode.php mirrored. Commit cbe0fc5 + tag v3.0.78 pushed to GLOO-ooo/cnvs-studio-v3.', scope: ['Reload homepage and look for CNVS: Studio pill in admin bar', 'Click pill → reloads → label flips to CNVS: GSAP', 'Press Alt+\ to hide studio → scroll-tween should fire', 'Press Alt+\ to restore studio → tween freezes again'] },
  { id: 'CNV-138', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T22:00:00Z', shippedAt: '2026-05-10T22:15:00Z', t: 'HOTFIX: parse error in widget.php (3.0.77)', s: 'WordPress went white-screen with `unexpected end of file, expecting ]` on canvas-studio-elementor-widget.php:2648. Root cause: _post_process_effects_from_cloud_map() was added in the v3.0.72 PHP-layer commit but only the function declaration + first array key got written — the body, the array close, the function close, the class close, and the Plugin::register_widget_type() call were all missing. The file was open-ended PHP that happened to parse fine until somebody parsed the second half. Completed the function (cloud-map → repeater translation), added _infer_effect_type_from_keys (referenced earlier but undefined), closed the class, restored the registration line. Site back up. Pushed main + tag v3.0.77 to GLOO-ooo/cnvs-studio-v3 — same commit also brings remote main up from 7e90687 to current dev state (v3.0.72→76 work in one merge commit on top of the bootstrap).'  },
  { id: 'CNV-137', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T19:30:00Z', shippedAt: '2026-05-10T20:00:00Z', t: 'Phantom-merge UNION + shortcode GSAP parity + transition .catch (3.0.76)', s: 'Three fixes in one bump: (1) v3.0.73 phantom-merge guard was substituting whole repeater arrays — broke bundle init on pages where raw _elementor_data is also partial (Y2.init -> .split() of undefined on geometry-shapes). Rewrote as per-item UNION via _id/unique_id match: keep v3 item shape, fill missing fields from raw, never overwrite an existing v3 value, never replace the array. (2) Shortcode now ships GSAP parity. Removed hardcoded disableGsap=true from enqueue_theatre_scripts() — flag now mirrors the widget ("enabled when animation_settings.global.enabled is true"). Shortcode render() now also calls $widget->generate_animation_code($post_id, $unique_id) so per-transition ScrollTrigger.create modules emit on shortcode-only pages too. generate_animation_code + helpers (get_animation_settings, get_canvas_project_states, find_project_state_by_state_id) flipped to public for cross-class reuse. (3) Animation transition .then() chain now has .catch() that logs the actual error. Was failing silently — bundle init throws -> Theatre project missing -> precomputeChangedObjects errors -> ScrollTrigger.create below the throw never ran -> 3 triggers instead of 5 on homepage with no console diagnostic. Now the error surfaces. Commit 1bf4ab7 + tag v3.0.76. push-everything.ps1 updated.', scope: ['Reload geometry-shapes — confirm Y2.init split error is gone', 'Reload homepage — read the new .catch error to find what was killing transitions 1+2', 'Try shortcode-only test page on a Block Editor post', 'Sprint towards Elementor-free LinkShop fresh site (HUB-303 pairing)'] },
  { id: 'CNV-136', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T19:00:00Z', shippedAt: '2026-05-10T19:30:00Z', t: 'localStorage stale-state guard (3.0.75)', s: 'Final regression layer for the homepage. The bundle reads canvasStudioloadState{pageId} from localStorage to remember the last Theatre.js state across editor sessions, and prefers it over canvasStudioData_*.responsiveStates.desktop. The homepage had this stuck on "00" — a state with the OLD light naming (rect/spot/dir) that no longer matches the current point1/2/3 lights. Even after restoring the rich data and fixing responsive_states, the bundle kept loading "00" → flat scene. Verified: setting localStorage.canvasStudioloadState39070="startnew" + reload → dramatic dark Thinker with both halo rings glowing, matches ooo. Code fix in cnvs-core.js: on cache-bust URLs (?cb...) or when localStorage is one of the known-stale defaults ("00", "01", null, empty), prefer responsiveStates.desktop and write that into localStorage. Editor-driven state switches still flow through localStorage as before. Commit df206b6 + tag v3.0.75.', scope: ['User clears their browser localStorage one time (one-liner in DevTools)', 'Future page loads use the guard, no manual fix needed'] },
  { id: 'CNV-135', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T18:00:00Z', shippedAt: '2026-05-10T18:30:00Z', t: 'Homepage rendering RESTORED from May 2 backup', s: 'Three layers of regression on post 39070, all repaired: (1) v3 post_meta canvas_studio_settings_83b3cb4 had PHANTOM repeater rows — only id-shaped fields per item, all per-material/per-light config stripped — and these were overriding the rich v0.5 _elementor_data via array_merge in widget render. Fixed structurally in 3.0.73 phantom-merge guard. (2) responsive_states was the literal string "yes" instead of the {desktop, tablet, mobile} object the bundle reads to load Theatre.js initial state. Fixed by writing {desktop:"startnew", mobile:"MOBILESTART", tablet:"MOBILESTART"} (matches ooo). (3) The actual rich data WAS gone from local DB for 5+ months including all revisions — recovered from May 2 wpress backup at C:\\Users\\ozomr\\Desktop\\vibe\\cnvs.gloo.ooo\\cnvsstudio-20260502225959-x1zrq.zip. Extracted _elementor_data, canvas_studio_processed_config_general, canvas_studio_states, canvas_studio_animation_settings; URL-rewrote cnvs.gloo.ooo -> cnvs.gloo.local; wrote them back; cleared phantoms. RESULT: post 39070 now renders the dark moody Thinker with proper depth/shadows matching ooo. Halo glow + scroll-driven animations should follow. The diag/restore script is at canvas-studio-v3/_diag-pp.php with backup files in _restore/ (gitignored — per-post + per-backup, not source).', scope: ['Verify halos appear at correct scroll positions', 'Repeat restore for any other phantom-affected posts', 'Phantom-merge guard catches future occurrences in code (v3.0.73)'] },
  { id: 'CNV-134', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T17:00:00Z', shippedAt: '2026-05-10T17:30:00Z', t: 'Homepage responsive_states fixed (3.0.74)', s: 'Found the actual cause of the flat-gray render. canvas_studio_settings_83b3cb4.responsive_states was the literal STRING "yes" — not the {desktop, tablet, mobile} object the bundle expects. ooo has {desktop:"startnew", mobile:"MOBILESTART", tablet:"MOBILESTART"}. Of 12 saved Theatre.js states, 4 (00/01/00m/01m) reference an OLD light naming (rect1/rect2/rect3/spot/dir/spot1/spot2/spot3) that the current lightsList no longer has — current uses point1/point2/point3/amb. Theatre overrides applied to non-existent objects = lights stay at defaults = flat lit scene. Newer states (startnew/midnew/endnew/MOBILESTART/MOBILEEND) all reference point1/2/3 and would render correctly. Fix delivered out-of-band via diag script: wrote responsive_states {desktop:"startnew",mobile:"MOBILESTART",tablet:"MOBILESTART"} into both v3 post_meta and _elementor_data widget settings, plus desktop/tablet/mobile_initial_state scalars, and cleared the cloud cache. Verified script_data.responsiveStates is now the correct object. NOTE: this only affects PUBLIC (non-admin) views. Admin/logged-in views still load whatever state the editor last had active (currently "00", an old config) — so the gray render persists for the admin until they click "startnew" in the panel state dropdown. Last-active-state is editor-internal, not in source.', scope: ['Verify public view loads dramatic lighting (log out + reload)', 'If admin should default to startnew too: surface that decision in panel UX'] },
  { id: 'CNV-133', col: 'wip', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T16:30:00Z', t: 'Homepage materials/lights phantom — data restoration needed', s: 'After bloom fix (3.0.72), user said homepage still broke. Visual diff: ooo (v0.5 plugin) renders dark moody Thinker w/ visible halo glows; local (v3 plugin) renders flat gray Thinker, no halos. Same elementsList/lightsList/materialsList structurally but ooo has 38 material keys (with empty-{id,size,url} placeholder maps) while local has only 6 (color, _id, material_type, shininess, target, unique_id). Diagnosis: post 39070 _elementor_data and v3 post_meta canvas_studio_settings_83b3cb4 BOTH have phantom-only repeater items (4-key skeletons: _id, unique_id, *_type, target). Even ALL post revisions back to 2025-12-22 are phantom-only — the rich data has been wiped from local for 5+ months. ooo renders correctly because its cloud-cached processed_config has the full data from before the wipe; local cleared its cloud cache mid-session and rebuilt from current phantom data. Code-side fix shipped in 3.0.73: phantom-list merge guard generalises the post_process_effects fix to all repeaters (materials_list, lights_list, elements_list, instancer_list, post_process_effects, layers_list) — drops phantom v3 row in favour of substantive _elementor_data when available. This is structural, not data recovery. Data recovery options: (1) restore from a backup; (2) snapshot ooo cloud config and replay onto local; (3) re-enter materials/lights via v3 panel by hand. None automated yet.', scope: ['Pick a recovery path (backup/ooo-snapshot/manual)', 'Restore canvas_studio_settings_83b3cb4 with full materials_list + lights_list', 'Verify visual matches ooo'] },
  { id: 'CNV-132', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T12:00:00Z', shippedAt: '2026-05-10T12:50:00Z', t: 'Homepage bloom regression fixed (3.0.72)', s: 'User: regression on http://cnvs.gloo.local/?cb10ghj — bloom missing vs ooo. Root cause: post_process_effects on this page had only a phantom {_id: f91811d} entry (v0.5→v3 migration left an Elementor repeater placeholder with effect_type/effect_enabled/params all stripped). _resolve_post_process_effects() saw a non-empty array and short-circuited before falling through to legacy/cloud, so bloom never reached script_data.postProcessing. Fix: (1) phantom detector treats any list whose every item is {_id only} as empty so legacy/cloud fallbacks still kick in; (2) widget render now propagates per-effect params (bloom_strength/radius/threshold etc.) into pp_config[type] with a generic <type>_<rest> camelCased fallback for unmapped types and slider-object unwrapping; (3) restored bloom data to canvas_studio_settings_83b3cb4 for post 39070 with default params (1.5/0.4/0.85 — matches ooo). Verified: postProcessing.bloom now has {enabled:true, radius:0.4, strength:1.5, threshold:0.85} matching ooo exactly. Local commit f5f35ad on main + tag v3.0.72; push pending GitHub creds on user machine.' },
  { id: 'CNV-131', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-09T23:55:00Z', shippedAt: '2026-05-10T00:30:00Z', t: 'Monkey-patch sweep done (3.0.67-3.0.68)', s: 'Per user: ripped 1-3, kept 4 sanctioned, 5+drop poll, 8 dropped, camera fixed properly. Concretely: (#9) wireframe race-write at line 1411 removed. (#11) 500ms canvasStudioUnsaved poll removed (defineProperty alone is enough). (#8) sheetAnimationStates Map mutation removed (bundle owns playback persistence; we just call sequence.play). (#1-3) Three.js FileLoader/ImageLoader/TextureLoader prototype overrides removed; replaced with data-side empty-URL stripping that runs at boot + on cnvs:scriptDataUpdated event. (#6-7) Camera swap reworked: OrbitControls now properly recreated via `new OrbitClass(newCam, dom)` with config snapshot/copy (clean instance replace, not property write). cameraController.camera write retained as the sanctioned v3 deviation (bundle has zero runtime camera-type-swap API; v0.5 parity for type change was save+reload). Reference distribution to cameraController/rendererController/sceneController + bundle setCamera() if available. KEPT: #4 LU shim + lock (sanctioned single-pipeline), #5 canvasStudioUnsaved defineProperty (no bundle event), #10 wireframe direct-apply field-keyed write (user-driven only, not a race).' },
  { id: 'CNV-123-update', col: 'archive', proj: 'cnvs', pri: 'high', t: 'Renderer UI duplication — keep editor, drop schema', s: 'User decided: keep the editor right-panel render-surfaces UI (Theatre obj prop tree). My settings-panel render_surfaces repeater is the duplication, even though it had auto-z + drag indicator. CNV-123 stays open scoped to: surface drag-to-reorder + drop z_index field on the Theatre side. The settings-panel render_surfaces repeater stays buried (it\'s in renderer_section which is target=editor, never rendered in settings panel anyway).' },
  { id: 'CNV-123', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T00:35:00Z', shippedAt: '2026-05-10T00:50:00Z', t: 'z-index removed from Drive prop tree on Renderer (3.0.69)', s: 'Drive tab on the Renderer entry now strips zIndex / z_index / zindex / "Z Index" / z-index keys at any depth in the prop tree. Surface stacking is auto-derived from render_surfaces array order (Setup tab). Drive-side drag-to-reorder is still a deferred ask — the prop tree comes from the bundle Theatre obj which we don\'t reorder; the Setup tab repeater already supports drag (3.0.51).' },
  { id: 'CNV-124', col: 'done', proj: 'cnvs', pri: 'high', startedAt: '2026-05-10T00:35:00Z', shippedAt: '2026-05-10T00:50:00Z', t: 'Special Effect → render_surface auto-sync (3.0.69)', s: 'When effect_type changes to fluid/neon/particle/image_particle/trail, panel auto-creates a webgl_effect surface entry tagged `_auto: special-fx` with the matching subtype. effect_type=none removes the auto entry. User-managed surfaces (no `_auto` tag) are never touched. The auto-surface shows up in the renderer layers UI without the user having to add it manually.' },
  { id: 'CNV-123', col: 'wait', proj: 'cnvs', pri: 'high', t: 'Renderer surfaces UI duplication', s: 'User screenshot: editor right panel for Scene → Renderer shows General + CSS2D Settings + CSS3D Settings as Theatre.js obj props (NOT schema-driven). Has a z-index control (regression — auto-z was added to render_surfaces in settings panel only). Not draggable (regression — drag-reorder added to settings repeater only). I added auto-z + drop indicator to ONE render_surfaces UI (settings panel) but the editor exposes a DIFFERENT bundle-driven prop tree that\'s untouched. Duplication.', scope: ['Decide canonical UI: settings panel repeater OR editor Theatre obj — pick one', 'If keeping editor Theatre obj as canonical: filter z_index at the Drive tab and add drag-to-reorder to the prop tree', 'If keeping settings repeater as canonical: hide the renderer entry from the Theatre obj sheet'] },
  { id: 'CNV-124', col: 'wait', proj: 'cnvs', pri: 'high', t: 'Special effects flow on add', s: 'When user adds a special effect: (1) needs to appear immediately in the right panel under a "Special Effects" folder (folder hidden if no effects); (2) needs to appear in the renderer layers UI too. Today neither happens consistently — partly tied to CNV-123 duplication.', scope: ['Add Special Effects folder render path to editor right panel', 'Hide folder when post_process_effects array empty', 'Auto-add render-surface entry for new webgl_effect surfaces'] },
  { id: 'LIS-001', col: 'done', proj: 'omnicity', pri: 'high', startedAt: '2026-05-13T13:23:00Z', shippedAt: '2026-05-13T13:30:00Z', t: 'LinkShop spine smoke-tested end-to-end', s: 'Order #1230 placed via picker → cart → checkout. Bridge fired POST→Hub (HTTP 202, job hub-2026-05-13-a20ddf6f). Synthetic callback accepted (HMAC verified). Fulfillment block rendered. Gantt email fired. My Account → Published Articles shows all 3 publications with target_url preserved (v0.8.1 fix verified). Credits +7 granted from unfilled slots.' },
  { id: 'LIS-002', col: 'done', proj: 'omnicity', pri: 'med',  startedAt: '2026-05-13T15:25:00Z', shippedAt: '2026-05-13T15:32:00Z', t: 'LinkShop v0.8.2 — credit redemption ledger fix', s: 'Smoke test surfaced that when admin manually transitions order processing→completed, the customer session is gone and deduct_on_complete silently skipped the ledger entry. Now stash credits_to_redeem onto order meta at woocommerce_checkout_create_order, prefer it over session in deduct_on_complete, idempotency guard via _lcs_credits_redeemed, and hook both order_status_processing + order_status_completed.' },
  { id: 'HUB-302', col: 'done', shippedAt: '2026-05-13T16:05:00Z',  proj: 'hub',      pri: 'high', startedAt: '2026-05-13T15:00:00Z', t: 'pbn-master-dispatcher v0.1.0 BUILT (install pending)', s: 'New single-file Hub plugin walks jobs from sites_selected → scheduled → dispatched → published → reported → done automatically. Hooks pbn_master_job_advance. For each line in payload.lines[]: POSTs the AI-generated article to https://{domain}/wp-json/pbn/v1/posts with Bearer pbn-master-2024-x9k2, collects publish_url, persists publications. Builds the HMAC-signed callback envelope and POSTs to LinkShop /wp-json/linkshop/v1/hub-callback. Idempotent. Admin shows per-job dispatch logs. Zip ready at outputs/pbn-phase2/pbn-master-dispatcher-v0.1.0.zip — needs install on hub.d3v.co.il/wp-admin then smoke test.', scope: ['Install pbn-master-dispatcher-v0.1.0.zip on hub.d3v.co.il', 'Place a fresh LinkShop test order', 'Confirm Hub auto-advances all states without manual button-clicks', 'Confirm LinkShop receives the callback automatically', 'Tighten secret rotation (HUB-307) once flow proven'] },
  { id: 'HUB-302b', col: 'done', proj: 'hub', pri: 'high', shippedAt: '2026-05-19T01:58:00Z', t: 'Dispatcher rewired to PBN_Hub_API::factory_publish() — child publish path fixed', s: 'Shipped pbn-master-dispatcher v0.1.1. The canonical Hub method turned out to be PBN_Hub_API::factory_publish(string $domain, array $payload):array (not publish_article — that name never existed; the kanban note was wrong). Rewrote dispatch_one() to call factory_publish() in-process instead of wp_remote_post() to the nonexistent /wp-json/pbn/v1/posts. Payload now matches what ajax_factory_publish and PBN_Hub_Tool_Push_To_Site::execute send: {title, content, status:publish, post_date, category_ids, images, featured_image, factory:true}. Response (id/edit_url/view_url/status/post_date or error) is mapped back into the same $pub dict the job-log/callback plumbing already expects. Added retry/backoff (max 3 attempts, linear 2/4/6s, retries on 5xx/408/429/no-status) and a class_exists(PBN_Hub_API) guard so the plugin fails loud if pbn-hub isn\'t active on the Hub WP install. Per-site bearer tokens from wp_pbn_hub_sites are handled by PBN_Hub_API automatically. Zip: canvas-studio/pbn-master-dispatcher-v0.1.1.zip (also at outputs/pbn-phase2/). Author bumped to Gloo Software. Source-of-truth file is outputs/pbn-phase2/hub-plugin/pbn-master-dispatcher.php — not in the pbn-hub GitHub repo, so no git push.', scope: ['Install pbn-master-dispatcher-v0.1.1.zip on hub.d3v.co.il (overwrite v0.1.0)', 'Confirm pbn-hub plugin is active (provides PBN_Hub_API)', 'Re-run the order #1238-style smoke test — expect publish_url populated from view_url', 'Verify pbn_dispatch_log_<job_id> shows child_publish_ok events with post_id', 'If retry path triggers in the wild, tune pbn_dispatch_max_attempts filter'] },

  { id: 'VOY-101', col: 'review', proj: 'voyc', pri: 'med', startedAt: '2026-04-30T20:00:00Z', t: 'Migration plan doc — Phase 2', s: 'Investigation: Commit #3 ("admin_api middleware swap") already landed as 8b1a6b0 on 2026-05-13 — adds supabase_auth.py + wires Supabase JWT decoder into get_admin_user with 13 tests. Card was stale. Remaining decision for Omri: flip ENABLE_SUPABASE_AUTH default to true OR rip out legacy JWT path OR set Render env — pick one, that becomes the actual unblock.', scope: ['Read JWT auth flow — DONE', 'Map JWT touchpoints — DONE', 'Write migration plan — DONE', 'Commit #3 — already shipped at 8b1a6b0', 'Decide: flip default, remove legacy, or env-only', 'Smoke-test against Phase 1 Supabase'] },

  { id: 'HUB-312', col: 'done', proj: 'hub', pri: 'high', startedAt: '2026-05-11T19:15:00Z', shippedAt: '2026-05-11T19:30:00Z', t: 'AI article worker plugin (HUB-304 first slice)', s: 'Hooks pbn_master_order_received → schedules WP-Cron 5s out → generates an article from intake fields → persists to wp_pbn_articles → advances queued → ai_generating → sites_selected. Provider-agnostic: Anthropic Claude default (claude-sonnet-4-6), OpenAI alternative (gpt-4o-mini), placeholder mode that writes a hand-stubbed Markdown article when no API key is configured (lets you walk the spine end-to-end without burning credits). Settings → PBN AI: provider, model, API key (encrypted AES-256-CBC with a per-site secret), system-prompt override. Cost estimator using public list pricing (claude-sonnet-4-6 $3/$15 per Mtok, gpt-4o-mini $0.15/$0.60, etc.). Recent-articles table in admin. PBN Orders page gains an article preview panel (rendered HTML + Markdown source). Error path: failure leaves the job at ai_generating with the error stored in wp_pbn_articles.error so the operator sees it.', scope: ['Install pbn-master-ai-worker-v0.1.0.zip on hub.d3v.co.il', 'Settings → PBN AI → pick provider + paste API key', 'Place an order with intake form → confirm Hub auto-advances to sites_selected within ~5s', 'Eyeball generated article via the PBN Orders preview panel', 'Tune system prompt for brand voice if needed'] },
  { id: 'HUB-311', col: 'done', proj: 'hub', pri: 'high', startedAt: '2026-05-11T19:00:00Z', shippedAt: '2026-05-11T19:30:00Z', t: 'Phase 2 spine v0.2 — intake form + state machine + callback round-trip', s: 'Closed the round-trip on top of HUB-310. Three new plugins ship in pbn-phase2-bundle-v0.2.0.zip: (1) linkshop-order-intake.php — customer-facing form on every Woo product page (target URL, anchor, keywords, language, length, deadline, custom instructions) → cart → checkout → order meta with _pbn_* keys. (2) linkshop-hub-callback.php — receives signed POST /wp-json/linkshop/v1/hub-callback from Hub, validates HMAC, persists publications + history on the order, fires linkshop_hub_callback action. Renders a Fulfillment block on the order edit screen. (3) pbn-master-jobs.php — companion to pbn-master-orders. Walks jobs through queued → ai_generating → sites_selected → scheduled → dispatched → published → reported → done state machine. v0.1 is manual: Advance and Send to LinkShop buttons in the PBN Orders admin. Future AI / dispatch plugins hook the pbn_master_job_advance action. Bundle has full smoke-test steps in README. Spine end-to-end now: storefront form → Woo → Hub intake → state walk → callback → publications visible on order.', scope: ['Install 5 plugins per README install order', 'Smoke test: 1₪ order → Hub job → manual advance → Send to LinkShop → order shows synthetic publication URLs', 'Decide: AI generation worker (HUB-304) or dispatch glue to existing v2.4 child code (HUB-302) next', 'Plug a customer-email companion plugin onto linkshop_hub_callback when status=published'] },
  { id: 'HUB-310', col: 'done', proj: 'hub', pri: 'high', startedAt: '2026-05-11T18:30:00Z', shippedAt: '2026-05-11T19:00:00Z', t: 'Phase 2 spine shipped — LinkShop → Hub fulfillment intake', s: 'Smallest end-to-end slice of HUB-300 architecture. Two single-file plugins + protocol doc. Hub-side: POST /wp-json/pbn/v2/orders endpoint, HMAC-SHA256 signed, per-sender secrets, idempotent via (sender, nonce), creates wp_pbn_jobs / wp_pbn_senders / wp_pbn_nonces tables on activate, admin UI under PBN Orders for sender + recent-job inspection. LinkShop-side: hooks woocommerce_order_status_completed, signs body, POSTs to Hub, logs request+response on the order (per-order meta box), Settings → Hub Bridge page for endpoint/sender/secret. Bundle in outputs/pbn-phase2/ — three zips: full bundle, hub-only, linkshop-only. Includes README + PROTOCOL-v2.md spec.', scope: ['Install pbn-master-orders-v0.1.0.zip on hub.d3v.co.il', 'Copy generated sender secret from PBN Orders admin', 'Install linkshop-to-hub-bridge-v0.1.0.zip on linkshop.co.il', 'Paste secret into Settings → Hub Bridge', 'Place 1₪ Woo test order + mark completed', 'Confirm job appears in PBN Orders → Recent jobs', 'Wire intake form (target_url / anchor / keywords) via order meta — separate plugin, out of spine scope'] },
  { id: 'HUB-300', col: 'wait', proj: 'hub', pri: 'high', t: 'Phase 2 architecture — LinkShop / Master Hub / Children', s: 'Direction set 2026-05-10. The current Hub plugin becomes the Master Hub layer. New: LinkShop (commerce/storefront, sends fulfillment payloads) + an evolved Child connector. Frontend moves off Elementor → React/Next + headless WP. Treat as normal SaaS orchestration (architecturally equivalent to MainWP, ManageWP, multisite tools, CI/CD). End-to-end flow: customer buys on LinkShop → LinkShop POSTs payload → Master Hub creates job → AI generates + selects sites + schedules → child sites publish → status returns to Hub → Hub aggregates report → LinkShop emails customer. Memory: pbn_hub_phase2.md.', scope: ['Connector protocol — first, gates everything else', 'Queue/job architecture', 'Scheduling engine', 'Child-site sync', 'Fulfillment state tracking', 'Reporting pipeline', 'React/Next frontend transition', 'API-first architecture', 'Auth/security hardening', 'Extensible agent workflow system'] },
  { id: 'HUB-301', col: 'review', proj: 'hub', pri: 'high', startedAt: '2026-05-22T00:00:00Z', t: 'Connector protocol v2 — Master Hub ↔ Children', s: 'Spec written: ~/Downloads/canvas-studio/specs/HUB-301-connector-v2.md. Audit surfaced two parallel auth systems already in Hub (per-site Bearer + shared pbn-master-2024-x9k2), scheduler is a literal stub, zero idempotency in PBN_Hub_API::request. Top 3 open Qs before M1: idempotency key scheme for status retries, header- vs URL-versioning, circuit-breaker tuning.', scope: ['Spec — DONE', 'Open Qs answered by Omri', 'Per-site secrets to retire the shared secret', 'Schedule-then-confirm vs publish-now flows', 'Heartbeat endpoint', 'Status-sync endpoint with publish URL + publish date + error', 'Idempotent job dispatch with order_id+anchor as key', 'Child plugin update path for the protocol bump'] },
  { id: 'HUB-302', col: 'wait', proj: 'hub', pri: 'high', t: 'Queue / job architecture in Master Hub', s: 'Master Hub becomes a distributed task scheduler. Receives fulfillment requests from LinkShop, persists fulfillment jobs, runs AI generation + site-selection + scheduling, dispatches publish jobs to children, retries on failure, tracks state. Existing Hub UI is request-response synchronous — needs to become async + state-machine driven.', scope: ['Job state machine: queued → ai-generating → site-selected → scheduled → dispatched → published → reported', 'Persistence layer (custom WP table or postmeta-backed)', 'Worker (WP-Cron + Action Scheduler hybrid?)', 'Retry policy + backoff', 'Failure handling + dead-letter visibility', 'Job inspector UI in Hub admin'] },
  { id: 'HUB-303', col: 'wait', proj: 'hub', pri: 'high', t: 'LinkShop — commerce/storefront layer', s: 'New layer. Customer-facing platform: products/packages, checkout/credits, order intake, customer comms, status display, emails. Does NOT fulfill. POSTs the fulfillment payload to Master Hub on order completion. Decision pending: WooCommerce-driven WP install OR Next.js storefront with WP-as-API.', scope: ['Decide: Woo-WP vs Next.js + headless WP', 'Product/package catalog model', 'Credit system + balance', 'Checkout + payment provider', 'Order intake schema (target URL, anchor, keywords, language, length, scheduling, deadline, custom)', 'Fulfillment-payload contract → Master Hub', 'Status webhook from Hub', 'Customer email pipeline', 'Order tracking page'] },
  { id: 'HUB-304', col: 'wait', proj: 'hub', pri: 'med', t: 'AI agent workflow — site selection + content gen', s: 'Master Hub\'s AI layer. Takes a fulfillment request and decides where articles go, when, what gets written, internal-link distribution. Generates: structure, body, titles, metadata, keywords, anchor placements, summaries, final reports. Should know: site categories, language compatibility, authority, topic suitability, publication load, scheduling availability, history, client constraints.', scope: ['Site-selection scoring (category/lang/authority/load/relevance)', 'Generation pipeline (prompt → structure → body → metadata)', 'Anchor placement strategy', 'Quality gate / pre-publish review', 'Generation cost tracking per order', 'Templates per package type'] },
  { id: 'HUB-305', col: 'wait', proj: 'hub', pri: 'med', t: 'Frontend transition off Elementor', s: 'Phase 2 calls for the application/dashboard layer to move to React/Next.js + headless WP. Public marketing pages can stay WP if desired. Dashboard screens to migrate: order tracking, reports, credits, site management, scheduling, fulfillment state, article previews, publication logs, analytics.', scope: ['Pick stack (Next.js app router + shadcn/ui likely matches existing Vercel projects)', 'Set up Next app + auth bridge to WP', 'Migrate dashboard screens one by one', 'Keep WP marketing pages for now', 'Vercel deploy under otwdesign team'] },
  { id: 'HUB-306', col: 'wait', proj: 'hub', pri: 'high', t: 'Reporting pipeline — fulfillment → customer', s: 'Hub aggregates per-order: publication URLs, publish dates, statuses, errors. Generates a structured report. Sends to LinkShop. LinkShop emails the customer. Currently Hub has no aggregated report concept — need to build it.', scope: ['Per-order report schema', 'Aggregator that walks job + child responses', 'Webhook back to LinkShop with the report payload', 'Report rendering on customer dashboard (HUB-305)', 'Email template for the customer notification'] },
  { id: 'HUB-307', col: 'wait', proj: 'hub', pri: 'med', t: 'Auth + security hardening for the connector', s: 'Phase 2 raises the stakes — replace the single shared secret with per-site tokens, add request signing, rotate-on-compromise. Pairs with HUB-301 protocol work.', scope: ['Per-site secret generation flow (Add Site → mint token)', 'HMAC request signing (timestamp + nonce + body)', 'Token rotation endpoint', 'Secret storage in Hub (encrypted)', 'Migration: dual-secret window so existing children keep working during rollout'] },
  { id: 'HUB-200', col: 'wait', proj: 'hub', pri: 'high', t: 'Track B — 108-site bulk install (path pick)', s: 'Sub-agent surfaced 3 paths after measuring real timing (3-5min/site = 5-9hrs). Pick: A marathon / B validated batch + script / C check Upress for native bulk-deploy first.', scope: ['User: pick A / B / C', 'Recommended: C → B → A — 10min check on Upress could save 6+ hours'] },
  { id: 'HUB-201', col: 'wait', proj: 'hub', pri: 'high', t: 'v2.5.0 features — operator\'s call', s: 'Two sub-agents independently declined the work after reviewing scope. Operator picks path forward: (a) write PRs yourself + Claude reviews, (b) different tool/provider builds while Claude helps adjacent infra, (c) park v2.5.0 + stay on v2.4.2.', scope: ['User: pick a / b / c', 'If a: write Favorites + Bulk Actions + Sprint Planner first; PR review available', 'If b: ship via different tool, Claude helps HUB-202/HUB-203/secret rotation in parallel', 'If c: close v2.5.0 thread'] },

  { id: 'OMN-200', col: 'done', proj: 'omnicity', pri: 'high', shippedAt: '2026-05-19T09:45:00Z', t: 'Vercel env vars for OAuth', s: 'Done — verified 2026-05-19. All six vars are set in Vercel otwdesign/omnicity (Production+Preview, Sensitive, added 2026-05-16): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, NEXTAUTH_URL, NEXTAUTH_SECRET. Plus the Supabase pair (NEXT_PUBLIC_SUPABASE_URL/ANON_KEY) which the code actually uses now — Omnicity migrated to Supabase signInWithOAuth, so NEXTAUTH_* are legacy and could be retired in a cleanup pass but cost nothing to leave.', scope: ['Set GOOGLE_CLIENT_ID + SECRET', 'Set GITHUB_CLIENT_ID + SECRET', 'Set NEXTAUTH_URL + NEXTAUTH_SECRET', 'Redeploy via Vercel'] },

  { id: 'JEP-202', col: 'done', proj: 'jepeto', pri: 'high', t: 'Doctor mode \u2014 chat + scheduled scans', s: 'JepetoWP Doctor with two modes: (a) scheduled DB/code scans on a cron (daily / weekly), (b) live chat where admin asks plain-language questions ("this page is slow on mobile, why?") and Doctor inspects DB + code + logs + returns diagnosis with suggested code diff. Fixes apply only on explicit user approval.', scope: ['Cron-driven scan engine', 'Chat UI', 'DB inspector', 'Code grep tool', 'Slow-query audit', 'Malware signature scanner', 'Plugin conflict detector', 'Diagnosis + diff suggestions', 'Approval-gated fix applier', 'History of fixes'], shippedAt: 1779309128025 },

  { id: 'CNV-300', col: 'done', proj: 'cnvs', pri: 'med', startedAt: '2026-05-09T20:30:00Z', shippedAt: '2026-05-09T21:15:00Z', t: 'TRELLIS via fal.ai — alternate 3D provider (3.0.57)', s: 'Wired client + backend. Schema: ai_3d_provider select in Settings → AI → 3D Model (Hunyuan default, TRELLIS via fal.ai alt). cnvs-ai-chat.callImageTo3D appends `provider` to the AJAX form. PHP image_to_3d() routes to /ai/hunyuan or /ai/trellis based on the param, error messages dynamically use provider name. Fly.io stays — no decommission. Last step (when ready): cloud router needs /ai/trellis endpoint that calls fal.ai TRELLIS.' },
  { id: 'CNV-200', col: 'done', proj: 'cnvs', pri: 'med', startedAt: '2026-05-09T20:00:00Z', shippedAt: '2026-05-09T21:30:00Z', t: 'Image→3D — both paths coexist (3.0.58)', s: 'User explicitly asked to keep the iframe popup AND have the AI agent path. Both wired now: (1) Settings → AI → 3D Model → ✨ Generate 3D Model opens cs-ai-modal iframe at popup_url, now with ?provider=… query so the popup pre-selects the same engine. (2) AI agent calls image_to_3d tool → canvas_studio_image_to_3d AJAX → /ai/hunyuan or /ai/trellis → sideloaded GLB → add_element. Same backend, two surfaces. Iframe stays, no deprecation.' },
  { id: 'CNV-201', col: 'archive', proj: 'cnvs', pri: 'low', t: 'Theatre Studio removed (Theatre Core stays)', s: 'Theatre Studio (editing UI, no license) was removed in 3.0.18+ and replaced with cnvs-theatre-bridge.js. Theatre Core (Apache 2.0, ~280KB) STAYS — still drives sequences/keyframes for sequencing + scroll. No "full removal" planned.' },
  { id: 'CNV-202', col: 'done', proj: 'cnvs', pri: 'med', startedAt: '2026-05-09T20:30:00Z', shippedAt: '2026-05-09T21:15:00Z', t: 'Map prop conditional visibility (3.0.57)', s: 'New __hasValue__ / __noValue__ sentinels in cnvs-controls applyConditions. Sub-controls now hide when parent map empty: bump_scale ← bump_map, normal_scale_x/y ← normal_map, displacement_scale/bias ← displacement_map, ao_map_intensity ← ao_map. Conditions re-evaluate on media set + media remove.' },
  { id: 'CNV-203', col: 'done', proj: 'cnvs', pri: 'med', startedAt: '2026-05-09T20:30:00Z', shippedAt: '2026-05-09T21:15:00Z', t: '3D model 404 fetch check (3.0.57)', s: 'GLTFLoader now HEAD-probes the URL before loading. 404 / network failure → skip the loader entirely with a clear console line + a CNVSToast surfacing the file name. HEAD-405 servers fall through to a Range-byte-0 GET. Stops the opaque "Failed to load buffer" stack on stale assets like marble_bust_01.gltf.' },
