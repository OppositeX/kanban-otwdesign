  { id: 'wip',     name: 'In progress',  tone: '#85B7EB' },
  { id: 'review',  name: 'Review',       tone: '#A78BFA' },
  { id: 'wait',    name: 'Awaiting you', tone: '#EF9F27' },
  { id: 'back',    name: 'Backlog',      tone: '#888780' }
];

let activeProj = 'all';
// Per-column visibility — defaults: archive hidden, others visible
const defaultVisibility = { done: true, archive: false, wip: true, review: true, wait: true, back: true };
// URL reset handler — visiting kanban-otwdesign.vercel.app/?reset wipes ALL local state
try {
  const params = new URLSearchParams(location.search);
  if (params.has('reset') || params.has('clear')) {
    localStorage.clear();
    history.replaceState(null, '', location.pathname);
  }
} catch (e) {}
let colVisibility = Object.assign({}, defaultVisibility, JSON.parse(localStorage.getItem('kanban_col_visibility') || '{}'));
// HARD GUARD: if every column ended up hidden (saved state corruption or accidental tap-spree),
// restore defaults so the board is never blank.
(function () {
  const visible = Object.keys(colVisibility).filter(k => colVisibility[k] !== false);
  if (visible.length === 0) {
    colVisibility = Object.assign({}, defaultVisibility);
    try { localStorage.removeItem('kanban_col_visibility'); } catch (e) {}
  }
})();
function persistColVisibility() { localStorage.setItem('kanban_col_visibility', JSON.stringify(colVisibility)); }
const checks = JSON.parse(localStorage.getItem('kanban_checks') || '{}');
function persistChecks() { localStorage.setItem('kanban_checks', JSON.stringify(checks)); }
let draggedTaskId = null;

// Project folders — purely a personal, local way to organize the Projects
// sheet. Lives only in this browser's localStorage: no Supabase table, not
// part of the agent sync protocol, agents never read or write this. Just
// for Omri to group projects however he wants.
let projectFolders;
try {
  projectFolders = JSON.parse(localStorage.getItem('kanban_folders') || '{"folders":[],"assignment":{}}');
} catch (e) { projectFolders = { folders: [], assignment: {} }; }
if (!Array.isArray(projectFolders.folders)) projectFolders.folders = [];
if (!projectFolders.assignment || typeof projectFolders.assignment !== 'object') projectFolders.assignment = {};
function persistFolders() { localStorage.setItem('kanban_folders', JSON.stringify(projectFolders)); }
function createFolder(name) {
  const id = 'fld_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  projectFolders.folders.push({ id, name, collapsed: false });
  persistFolders();
  return id;
}
function renameFolder(id, name) {
  const f = projectFolders.folders.find(f => f.id === id);
  if (f) { f.name = name; persistFolders(); }
}
const TRASH_RETENTION_DAYS = 30;
// Deleting a folder is a two-step click to confirm (see the render code)
// PLUS a 30-day undo window — never straight to gone. Its project
// assignments are left untouched while trashed, so restoring brings
// everything back exactly as it was.
function trashFolder(id) {
  const f = projectFolders.folders.find(f => f.id === id);
  if (f) { f.deletedAt = new Date().toISOString(); persistFolders(); }
}
function restoreFolder(id) {
  const f = projectFolders.folders.find(f => f.id === id);
  if (f) { delete f.deletedAt; persistFolders(); }
}
function purgeFolderForever(id) {
  projectFolders.folders = projectFolders.folders.filter(f => f.id !== id);
  Object.keys(projectFolders.assignment).forEach(k => {
    if (projectFolders.assignment[k] === id) delete projectFolders.assignment[k];
  });
  persistFolders();
}
function daysLeftInTrash(f) {
  const deleted = Date.parse(f.deletedAt || '') || 0;
  const ageDays = (Date.now() - deleted) / 86400000;
  return Math.max(0, Math.ceil(TRASH_RETENTION_DAYS - ageDays));
}
// Auto-purge anything past the retention window — called once at boot.
function purgeExpiredFolders() {
  const before = projectFolders.folders.length;
  projectFolders.folders.filter(f => f.deletedAt).forEach(f => {
    if (daysLeftInTrash(f) <= 0) purgeFolderForever(f.id);
  });
  if (projectFolders.folders.length !== before) persistFolders();
}
purgeExpiredFolders();

// Delete-folder confirmation state — clicking delete once "arms" it (shown
// as a distinct red "Confirm delete?" state); a second click within the
// window actually trashes it. Anything else — clicking elsewhere, letting
// the timer lapse — disarms it with no effect. This lives outside
// renderQlinks so it survives the full-innerHTML re-render that happens on
// every interaction.
let armedDeleteFolderId = null;
let armedDeleteTimer = null;
function disarmDelete() {
  armedDeleteFolderId = null;
  clearTimeout(armedDeleteTimer);
}
let trashExpanded = false;
function moveFolder(id, dir) {
  const idx = projectFolders.folders.findIndex(f => f.id === id);
  const swapIdx = idx + dir;
  if (idx < 0 || swapIdx < 0 || swapIdx >= projectFolders.folders.length) return;
  const tmp = projectFolders.folders[idx];
  projectFolders.folders[idx] = projectFolders.folders[swapIdx];
  projectFolders.folders[swapIdx] = tmp;
  persistFolders();
}
function assignProjectToFolder(key, folderId) {
  if (folderId) projectFolders.assignment[key] = folderId;
  else delete projectFolders.assignment[key];
  persistFolders();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function copyText(text) {
  if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => fallback()); }
  else { fallback(); }
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
}

function pingClaude(task, action) {
  const now = new Date().toISOString();
  let msg = ''; let mutated = false; let openClaude = false;
  // Cloud-first mutations — update in-memory task + PATCH the cloud row.
  const sbApply = (patch) => sbPatchTask(task.id, patch);
  // Only 'done'/'start'/'block'/'note' are reachable from the UI — no button
  // ever sends 'archive', 'backlog', or 'reset' (moveTask's drag-and-drop
  // path handles column changes to those separately), so those cases were
  // dead and have been removed rather than kept "just in case."
  switch (action) {
    case 'done':
      task.col = 'done';
      task.shippedAt = now;
      if (!task.startedAt) task.startedAt = now;
      sbApply({ col: 'done', shipped_at: now, started_at: task.startedAt });
      mutated = true;
      toast(`Marked ${task.id} done`);
      break;
    case 'start':
      task.col = 'wip';
      task.startedAt = now;
      task.shippedAt = undefined;
      sbApply({ col: 'wip', started_at: now, shipped_at: null });
      mutated = true;
      toast(`Started ${task.id}`);
      break;
    case 'block':
      task.col = 'wait';
      task.shippedAt = undefined;
      sbApply({ col: 'wait', shipped_at: null });
      mutated = true;
      toast(`Blocked ${task.id}`);
      break;
    case 'note':
      const note = prompt(`Note for ${task.id}:`, '');
      if (!note) return;
      msg = `Update for task ${task.id} ("${task.t}"): ${note}`;
      openClaude = true;
      break;
    default:
      msg = `Task ${task.id}: ${task.t}`;
      openClaude = true;
  }
  if (mutated) { persistOverrides(); renderSummary(); renderGrid(); }
  if (openClaude && msg) window.open(CLAUDE_URL + encodeURIComponent(msg), '_blank');
}

function moveTask(taskId, newCol) {
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  const now = new Date().toISOString();
  // Cloud-first mutation: update the in-memory task AND patch the cloud row.
  // Drop the override layers — they're legacy.
  task.col = newCol;
  const patch = { col: newCol };
  if (newCol === 'done') {
    task.shippedAt = now;
    patch.shipped_at = now;
    if (!task.startedAt) { task.startedAt = now; patch.started_at = now; }
  } else if (newCol === 'wip') {
    if (!task.startedAt) { task.startedAt = now; patch.started_at = now; }
    task.shippedAt = undefined;
    patch.shipped_at = null;
  } else {
    task.shippedAt = undefined;
    patch.shipped_at = null;
  }
  delete colOverride[taskId]; delete shippedOverride[taskId]; delete startedOverride[taskId];
  persistOverrides();
  sbPatchTask(taskId, patch);
  renderSummary();
  renderGrid();
  toast(`Moved ${taskId} to ${cols.find(c => c.id === newCol)?.name || newCol}`);
}

function renderSummary() {
  const total = tasks.length;
  const done = tasks.filter(t => effectiveCol(t) === 'done').length;
  const wip  = tasks.filter(t => effectiveCol(t) === 'wip').length;
  const wait = tasks.filter(t => effectiveCol(t) === 'wait').length;
  document.getElementById('summary').innerHTML = `
    <div class="stat"><span class="stat-label">Total</span><div class="stat-value">${total}</div></div>
    <div class="stat"><span class="stat-label">Shipped</span><div class="stat-value">${done}</div></div>
    <div class="stat"><span class="stat-label">Active</span><div class="stat-value">${wip}</div></div>
    <div class="stat"><span class="stat-label">On you</span><div class="stat-value">${wait}</div></div>`;

  // Top meta line — auto-updated every render.
  try {
    const activeProjs = new Set(
      tasks.filter(t => { const c = effectiveCol(t); return c !== 'archive' && c !== 'done'; })
           .map(t => t.proj)
    );
    let lastTs = 0;
    tasks.forEach(t => {
      const a = Date.parse((shippedOverride && shippedOverride[t.id]) || t.shippedAt || '') || 0;
      const b = Date.parse((startedOverride && startedOverride[t.id]) || t.startedAt || '') || 0;
      const ts = Math.max(a, b);
      if (ts > lastTs) lastTs = ts;
    });
    const lastDate = lastTs ? new Date(lastTs) : new Date();
    const iso = lastDate.toISOString().slice(0, 10);
    const meta = document.getElementById('meta-line');
    if (meta) meta.textContent = activeProjs.size + ' active projects · last updated ' + iso;
  } catch (e) { /* never block the rest of the render */ }
}

function renderFilters() {
  const counts = {};
  tasks.forEach(t => { counts[t.proj] = (counts[t.proj] || 0) + 1; });
  // Tasks can arrive for a proj key that hasn't been registered in
  // kanban_projects yet (agent created a card before/without a registry row).
  // Give it a placeholder chip instead of letting it hide with no way to filter to it.
  Object.keys(counts).forEach(k => {
    if (!projects[k]) projects[k] = { name: k, color: '#888780', bg: '#26262c', text: '#e8e8e6' };
  });
  let html = `<button class="chip ${activeProj === 'all' ? 'active' : ''}" data-proj="all">All <span style="opacity:.7">${tasks.length}</span></button>`;
  Object.keys(projects).forEach(k => {
    const p = projects[k];
    const c = counts[k] || 0;
    html += `<button class="chip ${activeProj === k ? 'active' : ''}" data-proj="${k}"><span class="dot" style="background:${p.color}"></span>${p.name} <span style="opacity:.7">${c}</span></button>`;
  });
  const el = document.getElementById('filters');
  el.innerHTML = html;
  el.querySelectorAll('.chip').forEach(b => {
    b.addEventListener('click', () => {
      activeProj = b.dataset.proj;
      renderFilters();
      renderGrid();
      // renderFilters() just replaced the DOM, so `b` is detached — look up
      // the freshly-rendered active chip instead of scrolling a stale node.
      const fresh = document.querySelector('#filters .chip.active');
      if (fresh) fresh.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    });
  });
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function formatElapsed(ms) {
  if (!Number.isFinite(ms) || ms < 0) return '';
  const sec = Math.floor(ms / 1000);
  const min = Math.floor(sec / 60);
  const hr = Math.floor(min / 60);
  const day = Math.floor(hr / 24);
  if (day >= 1) return `${day}d ${hr % 24}h`;
  if (hr >= 1) return `${hr}h ${min % 60}m`;
  if (min >= 1) return `${min}m`;
  return `${sec}s`;
}

function renderTimer(task) {
  const col = effectiveCol(task);
  const startedAt = effectiveStarted(task);
  const shippedAt = effectiveShipped(task);
  if (col === 'wip' && startedAt) {
    const elapsed = Date.now() - new Date(startedAt).getTime();
    return `<span class="timer live"><span class="pulse"></span>${formatElapsed(elapsed)}</span>`;
  }
  if (col === 'done' && startedAt && shippedAt) {
    const elapsed = new Date(shippedAt).getTime() - new Date(startedAt).getTime();
    return `<span class="timer shipped">${formatElapsed(elapsed)}</span>`;
  }
  return '';
}

function scopeProgress(task) {
  if (!task.scope || !task.scope.length) return null;
  const taskChecks = checks[task.id] || {};
  const done = task.scope.filter((_, i) => taskChecks[i]).length;
  return { done, total: task.scope.length };
}

function renderCard(t) {
  // Unknown proj key (e.g. agent-created before the registry row exists) must not crash the board.
  const p = projects[t.proj] || { name: t.proj || '?', color: '#888780', bg: '#26262c', text: '#e8e8e6' };
  const pri = priorities[t.pri] || priorities.med;
  const prog = scopeProgress(t);
  const progStr = prog ? `<span class="scope-progress">${prog.done}/${prog.total}</span>` : '';
  const timerHtml = renderTimer(t);
  // Board view is title-only by design — everything else (summary, note,
  // links, checklist) lives behind a tap, in the task detail sheet. The
  // note dot is the one exception: a compact signal that something needs
  // attention, without spilling its text onto the card.
  const noteDot = t.note ? `<span class="card-note-dot" title="${escapeHtml(t.note)}">${actionIcons.note}</span>` : '';
  return `<div class="card" data-task="${t.id}" draggable="true">
    <div class="card-top">
      <span class="card-tag" style="background:${p.bg};color:${p.text}">${p.name}</span>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">${timerHtml}<span class="card-id" data-id="${t.id}" title="Click to copy">${t.id}</span></div>
    </div>
    <p class="card-title">${escapeHtml(t.t)}${progStr}${noteDot}</p>
    <div class="card-foot">
      <span class="pri"><span class="pri-dot" style="background:${pri.color}"></span>${pri.label}</span>
      <button class="act-menu-btn" data-task="${t.id}" title="Actions" aria-haspopup="true">${actionIcons.menu}</button>
    </div>
  </div>`;
}

// The task detail sheet — "everything organized". Opened by tapping a card.
// Reuses the exact same sheet chrome as the Projects modal (see openSheet/
// closeSheet below) so it looks and behaves consistently.
function renderTaskDetail(id) {
  const t = tasks.find(x => x.id === id);
  const body = document.getElementById('task-detail');
  const titleLabel = document.getElementById('task-modal-title-label');
  if (!t || !body) return;
  const p = projects[t.proj] || { name: t.proj || '?', color: '#888780', bg: '#26262c', text: '#e8e8e6' };
  const pri = priorities[t.pri] || priorities.med;
  const prog = scopeProgress(t);
  const progStr = prog ? ` <span class="scope-progress">${prog.done}/${prog.total}</span>` : '';
  const timerHtml = renderTimer(t);
  const byHtml = t.updatedBy ? `<span class="card-by" title="Last updated by ${escapeHtml(t.updatedBy)}${t.updatedAt ? ' · ' + escapeHtml(String(t.updatedAt).slice(0, 16).replace('T', ' ')) : ''}">${escapeHtml(t.updatedBy)}</span>` : '';
  const tlinksHtml = (t.links && t.links.length)
    ? `<div class="tlinks">${t.links.map(l => `<a class="tlink" href="${escapeHtml(l.url)}" target="_blank" rel="noopener" title="${escapeHtml(l.label || l.kind || 'link')}">${linkIcons[l.kind] || linkIcons.live}<span>${escapeHtml(l.label || l.kind || 'link')}</span></a>`).join('')}</div>`
    : '';
  let scopeHtml;
  if (t.scope && t.scope.length) {
    const taskChecks = checks[t.id] || {};
    scopeHtml = t.scope.map((item, i) => {
      const checked = !!taskChecks[i];
      return `<label class="check ${checked ? 'checked' : ''}" data-task="${t.id}" data-i="${i}"><input type="checkbox" ${checked ? 'checked' : ''}><span class="check-text">${escapeHtml(item)}</span></label>`;
    }).join('');
  } else {
    scopeHtml = `<div class="scope-empty">No checklist for this task yet.</div>`;
  }

  if (titleLabel) titleLabel.textContent = t.id;

  body.innerHTML = `
    <div class="task-detail-head">
      <span class="card-tag" style="background:${p.bg};color:${p.text}">${escapeHtml(p.name)}</span>
      <span class="card-id" data-id="${t.id}" title="Click to copy">${t.id}</span>
    </div>
    <h2 class="task-detail-title">${escapeHtml(t.t)}</h2>
    <div class="task-detail-meta">
      <span class="pri"><span class="pri-dot" style="background:${pri.color}"></span>${pri.label}</span>
      ${timerHtml}
      ${byHtml}
    </div>
    ${t.s ? `<div class="task-section"><div class="scope-label">Summary</div><p class="task-detail-summary">${escapeHtml(t.s)}</p></div>` : ''}
    ${t.note ? `<div class="task-section"><div class="scope-label">Note</div><p class="card-note">${escapeHtml(t.note)}</p></div>` : ''}
    ${tlinksHtml ? `<div class="task-section"><div class="scope-label">Links</div>${tlinksHtml}</div>` : ''}
    <div class="task-section">
      <div class="scope-label">Scope${progStr}</div>
      ${scopeHtml}
    </div>
    <div class="task-detail-actions">
      <button class="act done" data-act="done" data-task="${t.id}" title="Mark done locally + ping Claude">${actionIcons.done} Done</button>
      <button class="act start" data-act="start" data-task="${t.id}" title="Start now + ping Claude">${actionIcons.start} Start</button>
      <button class="act block" data-act="block" data-task="${t.id}" title="Blocked — ping Claude">${actionIcons.blocked} Blocked</button>
      <button class="act note" data-act="note" data-task="${t.id}" title="Note for Claude">${actionIcons.note} Note</button>
    </div>
  `;

  const idEl = body.querySelector('.card-id');
  if (idEl) idEl.addEventListener('click', () => {
    copyText(t.id);
    idEl.classList.add('copied');
    toast(`Copied ${t.id}`);
    setTimeout(() => idEl.classList.remove('copied'), 1200);
  });
  body.querySelectorAll('.check').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const i = parseInt(el.dataset.i, 10);
      checks[id] = checks[id] || {};
      checks[id][i] = !checks[id][i];
      persistChecks();
      renderTaskDetail(id); // refresh the sheet (progress count, strikethrough)
      renderGrid(); // keep the board's own progress badge in sync
    });
  });
  body.querySelectorAll('.act').forEach(el => {
    el.addEventListener('click', () => {
      pingClaude(t, el.dataset.act);
      closeTaskModal();
    });
  });
}

function renderGrid() {
  const filtered = activeProj === 'all' ? tasks : tasks.filter(t => t.proj === activeProj);
  const visibleCols = cols.filter(c => colVisibility[c.id] !== false);
  const gridEl = document.getElementById('grid');
  const isMobile = window.innerWidth < 900;
  gridEl.style.gridTemplateColumns = isMobile ? '1fr' : `repeat(${visibleCols.length}, minmax(0, 1fr))`;
  gridEl.innerHTML = visibleCols.map(col => {
    const colTasks = filtered.filter(t => effectiveCol(t) === col.id);
    const cards = colTasks.map(renderCard).join('') || '<div class="empty">Nothing here</div>';
    return `<div class="col" data-col="${col.id}"><div class="col-head"><span class="col-name" style="color:${col.tone}">${col.name}</span><span class="col-count">${colTasks.length}</span></div>${cards}</div>`;
  }).join('');

  // Drop targets — every column accepts cards
  gridEl.querySelectorAll('.col').forEach(colEl => {
    colEl.addEventListener('dragover', e => {
      if (draggedTaskId) { e.preventDefault(); colEl.classList.add('drop-target'); }
    });
    colEl.addEventListener('dragleave', () => colEl.classList.remove('drop-target'));
    colEl.addEventListener('drop', e => {
      e.preventDefault();
      colEl.classList.remove('drop-target');
      if (!draggedTaskId) return;
      const newCol = colEl.dataset.col;
      moveTask(draggedTaskId, newCol);
      draggedTaskId = null;
    });
  });

  // Cards draggable — and, separately, a whole-card tap opens the detail
  // sheet. The id pill and action buttons stop propagation so tapping them
  // doesn't also pop the sheet open.
  gridEl.querySelectorAll('.card').forEach(cardEl => {
    cardEl.addEventListener('dragstart', e => {
      draggedTaskId = cardEl.dataset.task;
      cardEl.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', draggedTaskId); } catch (err) {}
    });
    cardEl.addEventListener('dragend', () => {
      cardEl.classList.remove('dragging');
      draggedTaskId = null;
      gridEl.querySelectorAll('.col.drop-target').forEach(c => c.classList.remove('drop-target'));
    });
    cardEl.addEventListener('click', () => openTaskModal(cardEl.dataset.task));
  });

  // Scoped to gridEl, not document — the task detail sheet has its own
  // .card-id/.act elements with their own listeners (wired in
  // renderTaskDetail); a global querySelectorAll here would double-attach
  // listeners to those every time the board re-renders in the background.
  gridEl.querySelectorAll('.card-id').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.id;
      copyText(id);
      el.classList.add('copied');
      toast(`Copied ${id}`);
      setTimeout(() => el.classList.remove('copied'), 1200);
    });
  });
  gridEl.querySelectorAll('.act-menu-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleActionMenu(btn.dataset.task, btn);
    });
  });
  closeActionMenu(); // stale trigger references from the previous render are gone now
}

function handoffStatusHtml(p) {
  if (p.handoff && p.handoff.trim()) {
    const who = p.handoffUpdatedBy ? escapeHtml(p.handoffUpdatedBy) : 'agent';
    const when = p.handoffUpdatedAt ? String(p.handoffUpdatedAt).slice(0, 10) : '';
    return `<span class="handoff-badge has">handoff · ${who}${when ? ' · ' + when : ''}</span>`;
  }
  return `<span class="handoff-badge none">no handoff yet</span>`;
}

function folderOptionsHtml(selectedId) {
  let html = `<option value="">No folder</option>`;
  projectFolders.folders.forEach(f => {
    html += `<option value="${f.id}"${f.id === selectedId ? ' selected' : ''}>${escapeHtml(f.name)}</option>`;
  });
  html += `<option value="__new__">+ New folder…</option>`;
  return html;
}

function qcardHtml(k) {
  const p = projects[k];
  const linksHtml = (p.links || []).map(l => `<a class="qlink" href="${l.url}" target="_blank" rel="noopener" title="${escapeHtml(l.label)}" onclick="event.stopPropagation();">${linkIcons[l.kind] || linkIcons.live}</a>`).join('');
  const logoInner = p.logoUrl ? `<img src="${p.logoUrl}" alt="${escapeHtml(p.name)}" onerror="this.parentElement.classList.remove('bare');this.parentElement.style.background='${p.color}';this.replaceWith(document.createTextNode('${p.logo}'));">` : p.logo;
  const logoClass = p.logoUrl ? 'qlogo bare' : 'qlogo';
  const logoStyle = p.logoUrl ? '' : `background:${p.color}`;
  const activeCls = activeProj === k ? ' active' : '';
  return `<div class="qcard${activeCls}" data-proj="${k}">
    <div class="qcard-top">
      <div class="${logoClass}" style="${logoStyle}">${logoInner}</div>
      <div class="qinfo">
        <div class="qname">${escapeHtml(p.name)}</div>
        ${handoffStatusHtml(p)}
      </div>
    </div>
    <div class="qlinks-row">${linksHtml}</div>
    <button class="resume-btn" data-resume="${k}" title="Copy a ready-to-paste resume prompt for this project" onclick="event.stopPropagation();">${actionIcons.copy} Copy resume prompt</button>
    <select class="folder-select" data-proj="${k}" title="Move to a folder — just for you, doesn't affect anything else" onclick="event.stopPropagation();">${folderOptionsHtml(projectFolders.assignment[k])}</select>
  </div>`;
}

// A small stacked-avatar preview of a folder's member projects, shown in
// the folder header regardless of collapsed state — so you can tell what's
// inside a folder without opening it.
function folderAvatarsHtml(memberKeys) {
  if (!memberKeys.length) return '';
  const MAX = 4;
  const shown = memberKeys.slice(0, MAX);
  const extra = memberKeys.length - shown.length;
  let html = shown.map(k => {
    const p = projects[k];
    if (!p) return '';
    if (p.logoUrl) {
      return `<span class="mini-logo bare" title="${escapeHtml(p.name)}"><img src="${p.logoUrl}" alt="" onerror="this.parentElement.classList.remove('bare');this.parentElement.style.background='${p.color}';this.textContent='${escapeHtml((p.logo || p.name || '?').slice(0, 2))}';"></span>`;
    }
    return `<span class="mini-logo" style="background:${p.color}" title="${escapeHtml(p.name)}">${escapeHtml((p.logo || p.name || '?').slice(0, 2))}</span>`;
  }).join('');
  if (extra > 0) html += `<span class="mini-logo mini-logo-more" title="${extra} more">+${extra}</span>`;
  return `<span class="qfolder-avatars">${html}</span>`;
}

function renderQlinks() {
  const el = document.getElementById('qlinks');
  const countEl = document.getElementById('projects-count');
  const keys = Object.keys(projects);
  if (countEl) countEl.textContent = `(${keys.length})`;

  const activeFolders = projectFolders.folders.filter(f => !f.deletedAt);
  const trashedFolders = projectFolders.folders.filter(f => f.deletedAt);

  const grouped = {};
  const unfiled = [];
  keys.forEach(k => {
    const fid = projectFolders.assignment[k];
    // A project assigned to a folder that's currently in the trash shows as
    // unfiled until the folder is restored — its assignment is untouched,
    // so it snaps right back in if you undo the delete.
    const inFolder = fid && activeFolders.some(f => f.id === fid);
    if (inFolder) { (grouped[fid] = grouped[fid] || []).push(k); } else { unfiled.push(k); }
  });

  let html = `<button class="new-folder-btn" id="new-folder-btn">+ New folder</button>`;
  activeFolders.forEach(f => {
    const members = grouped[f.id] || [];
    const collapsed = !!f.collapsed;
    const armed = armedDeleteFolderId === f.id;
    const deleteBtn = armed
      ? `<button class="folder-delete-confirm" data-folder-delete="${f.id}" title="Click again to move to Trash">Confirm delete?</button>`
      : `<button data-folder-delete="${f.id}" title="Delete folder (moves to Trash for ${TRASH_RETENTION_DAYS} days)">${actionIcons.delete}</button>`;
    html += `<div class="qfolder">
      <div class="qfolder-head" data-toggle-folder="${f.id}">
        <span class="qfolder-chevron${collapsed ? ' collapsed' : ''}">▾</span>
        <span class="qfolder-name">${escapeHtml(f.name)}</span>
        ${folderAvatarsHtml(members)}
        <span class="qfolder-count">${members.length}</span>
        <span class="qfolder-actions">
          <button data-folder-up="${f.id}" title="Move folder up">↑</button>
          <button data-folder-down="${f.id}" title="Move folder down">↓</button>
          <button data-folder-rename="${f.id}" title="Rename folder">${actionIcons.note}</button>
          ${deleteBtn}
        </span>
      </div>
      ${collapsed ? '' : `<div class="qcard-list qfolder-body">${members.length ? members.map(qcardHtml).join('') : '<div class="qfolder-empty">Nothing here yet — pick this folder from a project’s dropdown below.</div>'}</div>`}
    </div>`;
  });
  if (unfiled.length) {
    if (activeFolders.length) html += `<div class="qfolder-label">Unfiled</div>`;
    html += `<div class="qcard-list">${unfiled.map(qcardHtml).join('')}</div>`;
  }
  if (trashedFolders.length) {
    html += `<button class="trash-toggle" id="trash-toggle">${actionIcons.delete} Trash (${trashedFolders.length})<span class="qfolder-chevron${trashExpanded ? '' : ' collapsed'}">▾</span></button>`;
    if (trashExpanded) {
      html += `<div class="trash-list">${trashedFolders.map(f => `
        <div class="trash-item">
          <span class="trash-item-name">${escapeHtml(f.name)}</span>
          <span class="trash-item-days">${daysLeftInTrash(f)}d left</span>
          <button data-folder-restore="${f.id}" title="Restore folder">Restore</button>
          <button data-folder-purge="${f.id}" title="Delete forever — cannot be undone">Delete forever</button>
        </div>`).join('')}</div>`;
    }
  }
  el.innerHTML = html;

  el.querySelectorAll('.qcard').forEach(card => {
    card.addEventListener('click', () => {
      activeProj = card.dataset.proj;
      closeProjectsModal();
      renderFilters();
      renderGrid();
      renderQlinks();
    });
  });
  el.querySelectorAll('.resume-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.resume;
      copyText(generateResumePrompt(key));
      toast(`Copied resume prompt for ${projects[key] ? projects[key].name : key}`);
    });
  });
  el.querySelectorAll('.folder-select').forEach(sel => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', (e) => {
      e.stopPropagation();
      const key = sel.dataset.proj;
      if (sel.value === '__new__') {
        const name = (prompt('New folder name:', '') || '').trim();
        if (name) assignProjectToFolder(key, createFolder(name));
      } else {
        assignProjectToFolder(key, sel.value || null);
      }
      renderQlinks();
    });
  });
  el.querySelectorAll('[data-toggle-folder]').forEach(head => {
    head.addEventListener('click', () => {
      const f = projectFolders.folders.find(f => f.id === head.dataset.toggleFolder);
      if (f) { f.collapsed = !f.collapsed; persistFolders(); renderQlinks(); }
    });
  });
  el.querySelectorAll('[data-folder-up]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation(); moveFolder(btn.dataset.folderUp, -1); renderQlinks();
  }));
  el.querySelectorAll('[data-folder-down]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation(); moveFolder(btn.dataset.folderDown, 1); renderQlinks();
  }));
  el.querySelectorAll('[data-folder-rename]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const f = projectFolders.folders.find(f => f.id === btn.dataset.folderRename);
    if (!f) return;
    const name = (prompt('Rename folder:', f.name) || '').trim();
    if (name) { renameFolder(f.id, name); renderQlinks(); }
  }));
  // Delete is a two-click confirm, not a popup: first click arms the button
  // (it turns into a red "Confirm delete?" for 3s), a second click while
  // armed actually moves the folder to Trash. One wrong tap can't delete
  // anything, and even a confirmed delete is recoverable for 30 days.
  el.querySelectorAll('[data-folder-delete]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = btn.dataset.folderDelete;
    const f = projectFolders.folders.find(f => f.id === id);
    if (!f) return;
    if (armedDeleteFolderId === id) {
      disarmDelete();
      trashFolder(id);
      toast(`Moved "${f.name}" to Trash — recoverable for ${TRASH_RETENTION_DAYS} days`);
      renderQlinks();
      return;
    }
    disarmDelete();
    armedDeleteFolderId = id;
    armedDeleteTimer = setTimeout(() => { disarmDelete(); renderQlinks(); }, 3000);
    renderQlinks();
  }));
  el.querySelectorAll('[data-folder-restore]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const f = projectFolders.folders.find(f => f.id === btn.dataset.folderRestore);
    if (!f) return;
    restoreFolder(f.id);
    toast(`Restored "${f.name}"`);
    renderQlinks();
  }));
  el.querySelectorAll('[data-folder-purge]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const f = projectFolders.folders.find(f => f.id === btn.dataset.folderPurge);
    if (!f) return;
    if (!confirm(`Permanently delete "${f.name}"? This cannot be undone.`)) return;
    purgeFolderForever(f.id);
    renderQlinks();
  }));
  const trashToggleBtn = document.getElementById('trash-toggle');
  if (trashToggleBtn) trashToggleBtn.addEventListener('click', () => {
    trashExpanded = !trashExpanded;
    renderQlinks();
  });
  const newFolderBtn = document.getElementById('new-folder-btn');
  if (newFolderBtn) newFolderBtn.addEventListener('click', () => {
    const name = (prompt('New folder name:', '') || '').trim();
    if (name) { createFolder(name); renderQlinks(); }
  });
}

// Generic sheet open/close — bottom sheet on mobile, centered dialog on
// desktop (CSS handles the layout difference; this just drives the
// open/close transition + drag-to-dismiss on the handle). Both the Projects
// sheet and the task detail sheet share this exact same chrome/behavior;
// open state is tracked on the element itself (data-open) so any number of
// sheets can reuse these without stepping on each other.
function openSheet(modalId) {
  const modal = document.getElementById(modalId);
  if (!modal || modal.dataset.open === '1') return;
  modal.dataset.open = '1';
  modal.style.display = 'flex';
  // Force a style flush so the browser registers the closed state before we
  // flip to open on the next frame — otherwise the transition is skipped.
  void modal.offsetHeight;
  requestAnimationFrame(() => modal.classList.add('is-open'));
  document.body.style.overflow = 'hidden';
}
function closeSheet(modalId) {
  const modal = document.getElementById(modalId);
  if (!modal || modal.dataset.open !== '1') return;
  modal.dataset.open = '0';
  modal.classList.remove('is-open');
  document.body.style.overflow = '';
  const panel = modal.querySelector('.projects-modal-panel');
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    modal.style.display = 'none';
    if (panel) { panel.style.transition = ''; panel.style.transform = ''; }
    panel && panel.removeEventListener('transitionend', finish);
  };
  panel && panel.addEventListener('transitionend', finish);
  setTimeout(finish, 400); // fallback in case transitionend never fires
}
function openProjectsModal() { openSheet('projects-modal'); }
function closeProjectsModal() { closeSheet('projects-modal'); }
function openTaskModal(id) { renderTaskDetail(id); openSheet('task-modal'); }
function closeTaskModal() { closeSheet('task-modal'); }

// Wires a sheet's open trigger, close button, backdrop-tap, and Escape.
// toggleId may be null (the task sheet has no single fixed open button —
// it's opened per-card from renderGrid instead).
function wireSheet(modalId, toggleId, closeId) {
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById(modalId);
    if (!modal) return;
    if (toggleId) {
      const toggle = document.getElementById(toggleId);
      if (toggle) toggle.addEventListener('click', () => openSheet(modalId));
    }
    const closeBtn = closeId && document.getElementById(closeId);
    if (closeBtn) closeBtn.addEventListener('click', () => closeSheet(modalId));
    modal.addEventListener('click', (e) => { if (e.target === modal) closeSheet(modalId); });
  });
}
wireSheet('projects-modal', 'projects-toggle', 'projects-modal-close');
wireSheet('task-modal', null, 'task-modal-close');
wireSheet('stats-modal', 'stats-toggle', 'stats-modal-close');
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeSheet('projects-modal');
  closeSheet('task-modal');
  closeSheet('stats-modal');
});

// Drag-to-dismiss on a sheet's handle (mobile bottom-sheet layout only —
// harmless no-op on desktop since the handle is display:none there).
// Percentage-of-own-size + momentum dismissal per the Vaul/Sonner pattern:
// don't require dragging past a fixed pixel threshold, a quick flick should
// dismiss regardless of distance; dragging past the top damps instead of
// hard-stopping.
function wireSheetDrag(handleId, modalId) {
  document.addEventListener('DOMContentLoaded', () => {
    const handle = document.getElementById(handleId);
    const modal = document.getElementById(modalId);
    if (!handle || !modal) return;
    let dragging = false, startY = 0, startTime = 0, lastDy = 0, pointerId = null;

    handle.addEventListener('pointerdown', (e) => {
      const panel = modal.querySelector('.projects-modal-panel');
      if (!panel) return;
      dragging = true; startY = e.clientY; startTime = Date.now(); lastDy = 0; pointerId = e.pointerId;
      panel.style.transition = 'none';
      try { handle.setPointerCapture(pointerId); } catch (err) {}
    });
    handle.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pointerId) return;
      const panel = modal.querySelector('.projects-modal-panel');
      if (!panel) return;
      let dy = e.clientY - startY;
      if (dy < 0) dy = dy / 4; // boundary damping — dragging up past the resting position resists
      lastDy = dy;
      panel.style.transform = `translateY(${dy}px)`;
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      const panel = modal.querySelector('.projects-modal-panel');
      if (!panel) return;
      const elapsedMs = Math.max(1, Date.now() - startTime);
      const velocity = Math.abs(lastDy) / elapsedMs; // px/ms
      const shouldDismiss = lastDy > 0 && (lastDy > 120 || (lastDy > 24 && velocity > 0.5));
      if (shouldDismiss) {
        const h = panel.getBoundingClientRect().height || 400;
        panel.style.transition = `transform 220ms var(--ease-out)`;
        panel.style.transform = `translateY(${h}px)`;
        modal.dataset.open = '0';
        modal.classList.remove('is-open');
        document.body.style.overflow = '';
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          modal.style.display = 'none';
          panel.style.transition = ''; panel.style.transform = '';
          panel.removeEventListener('transitionend', finish);
        };
        panel.addEventListener('transitionend', finish);
        setTimeout(finish, 300);
      } else {
        panel.style.transition = `transform 220ms var(--ease-out)`;
        panel.style.transform = '';
        setTimeout(() => { panel.style.transition = ''; }, 260);
      }
    }
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  });
}
wireSheetDrag('sheet-handle-wrap', 'projects-modal');
wireSheetDrag('task-sheet-handle-wrap', 'task-modal');
wireSheetDrag('stats-sheet-handle-wrap', 'stats-modal');

// Card actions dropdown — one menu element reused for every card (populated
// fresh per open) instead of one hidden menu per card, positioned near the
// trigger button and clamped to stay inside the viewport.
function closeActionMenu() {
  const menu = document.getElementById('action-menu');
  if (!menu) return;
  menu.classList.remove('is-open');
  delete menu.dataset.forTask;
}
function toggleActionMenu(taskId, triggerEl) {
  const menu = document.getElementById('action-menu');
  if (!menu) return;
  if (menu.classList.contains('is-open') && menu.dataset.forTask === taskId) { closeActionMenu(); return; }
  menu.innerHTML = cardActionDefs.map(d =>
    `<button class="action-menu-item" data-act="${d.act}" role="menuitem">${actionIcons[d.act]}<span><span class="ami-label">${d.label}</span><span class="ami-desc">${d.desc}</span></span></button>`
  ).join('');
  menu.dataset.forTask = taskId;
  const rect = triggerEl.getBoundingClientRect();
  const MENU_W = 240, MENU_H_EST = 210;
  let left = rect.right - MENU_W;
  let top = rect.bottom + 6;
  if (left < 8) left = 8;
  if (left + MENU_W > window.innerWidth - 8) left = window.innerWidth - MENU_W - 8;
  if (top + MENU_H_EST > window.innerHeight - 8) top = rect.top - MENU_H_EST - 6; // flip above if no room below
  if (top < 8) top = 8;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  requestAnimationFrame(() => menu.classList.add('is-open'));
}
document.addEventListener('DOMContentLoaded', () => {
  const menu = document.getElementById('action-menu');
  if (!menu) return;
  menu.addEventListener('click', (e) => {
    const item = e.target.closest('.action-menu-item');
    if (!item) return;
    const taskId = menu.dataset.forTask;
    const task = tasks.find(t => t.id === taskId);
    closeActionMenu();
    if (task) pingClaude(task, item.dataset.act);
  });
});
// Close on outside click, Escape, or scroll (a stale-positioned menu is worse than none).
document.addEventListener('click', (e) => {
  const menu = document.getElementById('action-menu');
  if (!menu || !menu.classList.contains('is-open')) return;
  if (menu.contains(e.target) || e.target.closest('.act-menu-btn')) return;
  closeActionMenu();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeActionMenu(); });
window.addEventListener('scroll', () => closeActionMenu(), true);

function renderColToggles() {
  const el = document.getElementById('col-toggles');
  if (!el) return;
  el.innerHTML = cols.map(c => {
    const visible = colVisibility[c.id] !== false;
    const count = tasks.filter(t => effectiveCol(t) === c.id).length;
    return `<button class="chip col-toggle ${visible ? 'active' : ''}" data-col="${c.id}"><span class="dot" style="background:${c.tone}"></span>${c.name} <span style="opacity:.7">${count}</span></button>`;
  }).join('');
  el.querySelectorAll('.col-toggle').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.col;
      colVisibility[id] = colVisibility[id] === false ? true : false;
      persistColVisibility();
      renderColToggles();
      renderGrid();
    });
  });
}
document.getElementById('reset-all').addEventListener('click', () => {
  if (!confirm('Clear ALL locally-saved state? Cards return to source, all columns become visible, project filter resets to All.')) return;
  // Wipe every persisted layer that can make the board look empty
  colOverride = {}; shippedOverride = {}; startedOverride = {};
  colVisibility = Object.assign({}, defaultVisibility);
  activeProj = 'all';
  try { localStorage.removeItem('kanban_col_visibility'); } catch(e) {}
  persistOverrides(); persistColVisibility();
  renderSummary(); renderQlinks(); renderFilters(); renderColToggles(); renderGrid();
  toast('Cleared all local state');
});

// Safety net — if every column ends up hidden or filter excludes everything,
// auto-rescue by clearing local state and re-rendering.
(function emptyBoardSafetyNet() {
  const origRender = renderGrid;
  let triedRescue = false;
  window.renderGrid = function() {
    origRender();
    if (triedRescue) return;
    const visibleCardCount = document.querySelectorAll('#grid .card').length;
    if (visibleCardCount === 0 && tasks.length > 0) {
      triedRescue = true;
      console.warn('[kanban] board rendered empty despite', tasks.length, 'tasks - rescuing.');
      colOverride = {}; shippedOverride = {}; startedOverride = {};
      colVisibility = Object.assign({}, defaultVisibility);
      activeProj = 'all';
      try { localStorage.removeItem('kanban_col_visibility'); } catch(e) {}
      persistOverrides(); persistColVisibility();
      renderSummary(); renderQlinks(); renderFilters(); renderColToggles();
      origRender();
      toast('Auto-rescued: cleared stale local state');
    }
  };
})();

let _resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(_resizeTimer); _resizeTimer = setTimeout(renderGrid, 150); });

setInterval(() => {
  document.querySelectorAll('.timer.live').forEach(el => {
    const card = el.closest('.card');
    if (!card) return;
    const id = card.dataset.task;
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const startedAt = effectiveStarted(task);
    if (!startedAt) return;
    const elapsed = Date.now() - new Date(startedAt).getTime();
    const pulse = el.querySelector('.pulse');
    el.innerHTML = (pulse ? '<span class="pulse"></span>' : '') + formatElapsed(elapsed);
  });
}, 30000);

async function bootRender() {
  if (sbConfigured) {
    try {
      const [cloudTasks, cloudProjects] = await Promise.all([sbFetchTasks(), sbFetchProjects()]);
      if (cloudProjects) mergeCloudProjects(cloudProjects);
      if (cloudTasks && cloudTasks.length) {
        tasks.length = 0;
        for (const t of cloudTasks) tasks.push(t);
        colOverride = {}; shippedOverride = {}; startedOverride = {};
        try {
          localStorage.removeItem('kanban_col_override');
          localStorage.removeItem('kanban_shipped_override');
          localStorage.removeItem('kanban_started_override');
        } catch(e) {}
        console.log('[kanban] loaded', tasks.length, 'tasks from cloud');
      }
    } catch (e) {
      console.warn('[kanban] cloud boot failed', e);
    }
  }
  renderSummary();
  renderQlinks();
  renderFilters();
  renderColToggles();
  renderGrid();
}
bootRender();

if (sbConfigured) {
  let _projSnapshot = '';
  setInterval(async () => {
    const [cloudTasks, cloudProjects] = await Promise.all([sbFetchTasks(), sbFetchProjects()]);
    let changed = false;
    if (cloudProjects) {
      const snap = JSON.stringify(cloudProjects);
      if (snap !== _projSnapshot) {
        _projSnapshot = snap;
        mergeCloudProjects(cloudProjects);
        renderQlinks();
        renderFilters();
        changed = true;
      }
    }
    if (cloudTasks && cloudTasks.length) {
      const byId = new Map(tasks.map(t => [t.id, t]));
      for (const ct of cloudTasks) {
        const local = byId.get(ct.id);
        if (!local) { tasks.push(ct); changed = true; continue; }
        // updated_at bumps on every cloud write (agent or board), so it
        // catches note/links/scope edits too — not just column moves.
        if (local.updatedAt !== ct.updatedAt || local.col !== ct.col || local.shippedAt !== ct.shippedAt || local.startedAt !== ct.startedAt || local.t !== ct.t) {
          Object.assign(local, ct);
          changed = true;
        }
      }
    }
    if (changed) { renderSummary(); renderGrid(); }
  }, 30000);
}
